// ตัดพินอินของทั้งคำออกเป็นพยางค์ เพื่อหาพยางค์ของตัวอักษรแต่ละตัว
// กติกา: n / ng ท้ายพยางค์ ถ้าตามด้วยสระ แปลว่ามันเป็นพยัญชนะต้นของพยางค์ถัดไป
const PY_V="aeiouv\u00fc\u0101\u00e1\u01ce\u00e0\u0113\u00e9\u011b\u00e8\u012b\u00ed\u01d0\u00ec\u014d\u00f3\u01d2\u00f2\u016b\u00fa\u01d4\u00f9\u01d6\u01d8\u01da\u01dc";
const PY_SYL=new RegExp(
 "(?:zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?["+PY_V+"]+(?:ng(?![" +PY_V+ "])|n(?![" +PY_V+ "])|r(?![" +PY_V+ "]))?",
 "gi");
function syllables(py){
 const out=[];
 String(py||"").replace(/['\u2019]/g," ").split(/[\s\u00b7]+/).filter(Boolean)
  .forEach(part=>{ const m=part.match(PY_SYL); if(m) out.push(...m) });
 return out;
}
const HANZI=/[\u4e00-\u9fff]/;

// จับคู่ตัวอักษร → { w: คำที่ใช้อธิบาย, p: พินอินของตัวนั้น } แคชไว้ต่อระดับ
let cmLv=null, cmCache=null;
function charMap(lv){
 if(cmLv===lv && cmCache) return cmCache;
 const m={};
 words(lv).forEach(w=>{
  const hz=[...w.c].filter(c=>HANZI.test(c));
  const sy=syllables(w.p);
  const fit=(sy.length===hz.length);   // ตัดพยางค์ได้พอดีกับจำนวนตัวอักษรจึงจะเชื่อถือได้
  hz.forEach((c,i)=>{
   const single=(w.c===c);
   const cur=m[c];
   // เลือกคำที่เป็นตัวอักษรเดี่ยวก่อน รองลงมาคือคำที่ตัดพยางค์ได้พอดี
   if(!cur || (single && !cur.single) || (fit && !cur.fit && !cur.single)){
    m[c]={ w, p: fit ? sy[i] : "", single, fit };
   }
  });
 });
 cmLv=lv; cmCache=m; return m;
}
function charInfo(ch,lv){ const e=charMap(lv)[ch]; return e? e.w : null }
function charPy(ch,lv){ const e=charMap(lv)[ch]; return e? (e.p||e.w.p) : "" }

/* ---- หน้ารายการคำศัพท์ทั้งหมด ---- */
// ตัดวรรณยุกต์ออกจากพินอิน เพื่อให้พิมพ์ "shui" แล้วเจอ "shuǐ"
const TONE={"\u0101":"a","\u00e1":"a","\u01ce":"a","\u00e0":"a","\u0113":"e","\u00e9":"e","\u011b":"e","\u00e8":"e",
 "\u012b":"i","\u00ed":"i","\u01d0":"i","\u00ec":"i","\u014d":"o","\u00f3":"o","\u01d2":"o","\u00f2":"o",
 "\u016b":"u","\u00fa":"u","\u01d4":"u","\u00f9":"u","\u01d6":"v","\u01d8":"v","\u01da":"v","\u01dc":"v","\u00fc":"v"};
function plain(str){ return String(str||"").toLowerCase().replace(/[^\x00-\x7f]/g,c=>TONE[c]||c) }

function wrongCount(id){ return (S.wrong&&S.wrong[id])||0 }

function filtered(){
 const q=listQ.trim().toLowerCase(), qp=plain(listQ.trim());
 return words(S.level).filter(w=>{
  if(listF==="known" && !isLearned(w.id)) return false;
  if(listF==="new" && isLearned(w.id)) return false;
  if(listF==="wrong" && !wrongCount(w.id)) return false;
  if(!q) return true;
  return w.c.includes(q) || plain(w.p).includes(qp)
    || String(w.th).toLowerCase().includes(q) || String(w.lo).includes(q)
    || String(w.en).toLowerCase().includes(q);
 });
}

// จัดชนิดคำเข้ากลุ่มแม่แบบ
const PERSONA=new Set(["高兴","难过","累","忙","开心","快乐","幸福","生气","紧张","害羞","满意","伤心","骄傲",
 "勇敢","聪明","年轻","老","胖","瘦","帅","漂亮","可爱","懒","认真","努力","热情","友好","诚实","谦虚","乐观",
 "自信","自私","激动","兴奋","冷静","糊涂","可怜","寂寞","无聊","舒服","饿","渴","困","疼","健康","辛苦",
 "失望","愉快","后悔","惭愧","善良","坦率","活泼","粗心","马虎","耐心","勤奋","刻苦","专心"]);
const TIMEW=new Set(["今天","明天","昨天","现在","上午","下午","晚上","早上","中午","以前","以后","刚才","最近","周末","去年","平时","将来","目前","如今","当时","从前"]);
function posClass(w){
 if(TIMEW.has(w.c)) return "t";
 const p=w.pos||"";
 if(p.includes("名词")) return "n";
 if(p.includes("动词")) return "v";
 if(p.includes("形容词")) return PERSONA.has(w.c) ? "ap" : "a";
 return null;   // คำชนิดอื่น (副词 助词 介词 ...) แม่แบบใช้ไม่ได้
}

function fill(str,w,isPinyin){
 let r=String(str).replace(/\{w\}/g,w.c).replace(/\{p\}/g,w.p).replace(/\{m\}/g,meaning(w));
 if(isPinyin) r=r.charAt(0).toUpperCase()+r.slice(1);   // พินอินขึ้นต้นประโยคด้วยตัวใหญ่
 return r;
}

// ประโยคจริงจากบทเรียนไวยากรณ์ที่มีคำนี้อยู่
function realSentences(w){
 const out=[];
 for(let l=1;l<=6;l++) grams(l).forEach(g=>g.ex.forEach(e=>{
  if(e[0].includes(w.c)) out.push({zh:e[0], py:e[1], tr:exT(e), from:g.t});
 }));
 return out;
}

function allWordsPool(){
 const out=[];
 for(let l=1;l<=6;l++) words(l).forEach(x=>out.push({...x, lv:l}));
 return out;
}

function buildMatches(){

 return allWordsPool().filter(w=>

   || String(w.en).toLowerCase().includes(q)

}

/* ==================== ระบบสอบจำลอง HSK ====================
   โครงสร้างอ้างอิงจากข้อสอบจริง (จำนวนข้อ เวลา คะแนน เกณฑ์ผ่าน)
   ตัวข้อสอบสร้างขึ้นใหม่ทุกครั้งจากคลังคำศัพท์และไวยากรณ์ในแอป
   ไม่ได้คัดลอกข้อสอบจริงมาใช้                                   */

const EXAM={
 1:{min:40, total:200, pass:120, sec:[["listen",20],["read",20]]},
 2:{min:55, total:200, pass:120, sec:[["listen",35],["read",25]]},
 3:{min:85, total:300, pass:180, sec:[["listen",40],["read",30],["write",10]]},
 4:{min:100,total:300, pass:180, sec:[["listen",45],["read",40],["write",15]]},
 5:{min:120,total:300, pass:null,sec:[["listen",45],["read",45],["write",10]]},
 6:{min:140,total:300, pass:null,sec:[["listen",50],["read",50],["write",1]]}
};

let exam=null, examTimer=null;

/* ---------- คลังข้อมูลสำหรับออกข้อสอบ (สะสมตั้งแต่ระดับ 1) ---------- */
function examPool(lv){
 const out=[];
 for(let l=1;l<=lv;l++) out.push(...words(l));
 return out;
}
function examSentences(lv){
 const out=[];
 for(let l=1;l<=lv;l++) grams(l).forEach(g=>g.ex.forEach(e=>out.push({g,e})));
 return out;
}
const shuffle=a=>a.slice().sort(()=>Math.random()-.5);

/* ตัดประโยคจีนเป็นคำ โดยไล่จับคู่คำที่ยาวที่สุดก่อนจากคลังคำศัพท์ที่มี */
function segment(zh,lv){
 const dict=new Set(examPool(lv).map(w=>w.c));
 const out=[]; let i=0;
 while(i<zh.length){
  if(!HANZI.test(zh[i])){ i++; continue }          // ข้ามเครื่องหมายวรรคตอน
  let hit="";
  for(let len=Math.min(4,zh.length-i); len>=1; len--){
   const t=zh.substr(i,len);
   if(len===1 || dict.has(t)){ hit=t; break }
  }
  out.push(hit); i+=hit.length;
 }
 return out;
}

/* ---------- สร้างข้อสอบทีละข้อ ---------- */
function mcq(target,pool,mode){
 const others=shuffle(pool.filter(w=>w.id!==target.id)).slice(0,3);
 const all=shuffle([target,...others]);
 const q={sec:"",type:mode,ans:all.findIndex(w=>w.id===target.id),target};
 if(mode==="audio_mean"){ q.audio=target.c; q.opts=all.map(w=>meaning(w)) }
 else if(mode==="audio_hanzi"){ q.audio=target.c; q.opts=all.map(w=>w.c) }
 else if(mode==="hanzi_mean"){ q.prompt=target.c; q.sub=target.p; q.opts=all.map(w=>meaning(w)) }
 else if(mode==="mean_hanzi"){ q.prompt=meaning(target); q.opts=all.map(w=>w.c) }
 else { q.prompt=target.p; q.opts=all.map(w=>w.c) }   // pinyin_hanzi
 return q;
}

function buildExam(lv){
 const cfg=EXAM[lv], pool=examPool(lv), sents=examSentences(lv);
 const used=new Set();
 const pick=()=>{
  let w, guard=0;
  do{ w=pool[Math.floor(Math.random()*pool.length)]; guard++ }
  while(used.has(w.id) && guard<60);
  used.add(w.id); return w;
 };

 const sections=[];
 cfg.sec.forEach(([key,n])=>{
  const items=[];
  if(key==="listen"){
   for(let i=0;i<n;i++) items.push(mcq(pick(),pool, i%2 ? "audio_hanzi":"audio_mean"));
  } else if(key==="read"){
   const modes=["hanzi_mean","mean_hanzi","pinyin_hanzi"];
   for(let i=0;i<n;i++) items.push(mcq(pick(),pool,modes[i%3]));
  } else {
   // ส่วนเขียน: เรียงคำให้เป็นประโยค (รูปแบบเดียวกับ 书写 ของ HSK 3–4)
   const src=shuffle(sents);
   for(let i=0;i<n;i++){
    const s=src[i%src.length];
    if(!s) break;
    const toks=segment(s.e[0],lv);
    if(toks.length<3 || toks.length>9) { n++; continue }   // ข้ามประโยคที่สั้นหรือยาวเกินไป
    items.push({type:"order", sec:"", tokens:toks, shuffled:shuffle(toks), sentence:s.e[0],
                pinyin:s.e[1], trans:s.e});
    if(items.length>=n) break;
   }
  }
  sections.push({key, items});
 });

 const flat=[];
 sections.forEach(s=>s.items.forEach(q=>{ q.sec=s.key; flat.push(q) }));
 return {
  lv, cfg, sections, flat, i:0,
  answers:new Array(flat.length).fill(null),
  ends: Date.now()+cfg.min*60000,
  done:false
 };
}

/* ---------- ตรวจคำตอบ ---------- */
function isRight(q,a){
 if(a===null||a===undefined) return false;
 if(q.type==="order") return Array.isArray(a) && a.join("")===q.tokens.join("");
 return a===q.ans;
}
function examScore(){
 const per={};
 exam.sections.forEach(s=>{
  let ok=0;
  s.items.forEach(q=>{ const i=exam.flat.indexOf(q); if(isRight(q,exam.answers[i])) ok++ });
  per[s.key]={ok, n:s.items.length, score: s.items.length? Math.round(ok/s.items.length*100):0};
 });
 const total=Object.values(per).reduce((a,b)=>a+b.score,0);
 return {per, total, max:exam.cfg.total};
}

/* ---------- นาฬิกาจับเวลา ---------- */
function stopTimer(){ if(examTimer){clearInterval(examTimer);examTimer=null} }
function tickTimer(){
 stopTimer();
 examTimer=setInterval(()=>{
  const el=document.getElementById("clock");
  if(!el||!exam||exam.done){ stopTimer(); return }
  const left=Math.max(0, exam.ends-Date.now());
  const mm=String(Math.floor(left/60000)).padStart(2,"0");
  const ss=String(Math.floor(left%60000/1000)).padStart(2,"0");
  el.textContent=mm+":"+ss;
  el.style.color = left<300000 ? "var(--seal)" : "var(--ink-3)";
  if(left<=0){ stopTimer(); finishExam() }
 },500);
}
function finishExam(){
 stopTimer();
 exam.done=true;
 // เก็บคำที่ตอบผิดไว้ในสมุดคำผิด เพื่อใช้กรองในรายการคำศัพท์
 if(!S.wrong) S.wrong={};
 exam.flat.forEach((q,i)=>{
  if(q.type==="order" || !q.target) return;
  if(!isRight(q,exam.answers[i])) S.wrong[q.target.id]=(S.wrong[q.target.id]||0)+1;
 });
 const r=examScore();
 if(!S.exams) S.exams=[];
 S.exams.unshift({lv:exam.lv, at:Date.now(), total:r.total, max:r.max,
   per:Object.fromEntries(Object.entries(r.per).map(([k,v])=>[k,v.score])),
   pass: exam.cfg.pass===null ? null : r.total>=exam.cfg.pass});
 S.exams=S.exams.slice(0,10);
 store.save(S);
 render();
}

   <div style="border-top:1px dashed var(--line-2);margin-top:14px;padding-top:12px">
    ${cfg.sec.map(([k,n])=>`<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px">
      <span>${esc(secLabel(k))}</span><span class="muted">${n} ${esc(t("qUnit"))}</span></div>`).join("")}
   </div>
  </div>
  ${hasZhVoice()
    ? `<div class="note" style="background:var(--jade-soft);color:#1F4C3E">✓ ${esc(t("voiceOK"))}
        · <button id="tv" style="text-decoration:underline">${esc(t("testVoice"))}</button></div>`
    : `<div class="note" style="background:var(--seal-soft);color:#8E1D22">${esc(t("noVoiceExam"))}
        · <button id="tv" style="text-decoration:underline">${esc(t("testVoice"))}</button></div>`}
  <div class="note">${esc(t("examNote"))}</div>
  <div class="row"><button class="btn solid" id="start">${esc(t("startExam"))}</button></div>
  ${hist.length?`<p class="sec-label">${esc(t("history"))}</p>`+hist.map(e=>`
    <div class="wcard"><div class="wmain" style="cursor:default">
     <div style="flex:1">
      <div style="font-size:15px;font-weight:500">${e.total} / ${e.max}</div>
      <div class="tiny muted">${new Date(e.at).toLocaleDateString()}</div>
     </div>
     ${e.pass===null?`<span class="wtag">—</span>`
      :`<span class="wtag" style="color:${e.pass?"var(--jade)":"var(--seal)"};border-color:currentColor">
         ${e.pass?esc(t("passed")):esc(t("failed"))}</span>`}
    </div></div>`).join(""):""}`;
 bindBack();
 const tv=main.querySelector("#tv");
 if(tv) tv.onclick=()=>{ pickVoice(); if(voice){say("你好",false)} else {toast(t("noVoice"))} render() };
 main.querySelector("#start").onclick=()=>{ exam=buildExam(S.level); render() };
 // รายชื่อเสียงในเบราว์เซอร์บางตัวโหลดช้า จึงเช็คซ้ำอีกครั้งแล้ววาดใหม่ถ้าเพิ่งเจอ
 if(!voice) setTimeout(()=>{ pickVoice(); if(voice && view==="exam" && !exam) render() }, 900);
}

/* ---------- หน้าทำข้อสอบ ---------- */
function vExamRun(){
 const q=exam.flat[exam.i], n=exam.flat.length;
 const a=exam.answers[exam.i];

 let body="";
 if(q.type==="order"){
  const placed=Array.isArray(a)?a:[];
  body=`<div class="card" style="padding:20px 18px">
    <p class="tiny muted" style="margin:0 0 12px">${esc(t("orderHint"))}</p>
    <div class="answerline">${placed.length?placed.map(x=>`<span class="wchip on">${esc(x)}</span>`).join(""):`<span class="muted tiny">…</span>`}</div>
   </div>
   <div class="chiprow">${q.shuffled.map((tk,i)=>{
     const usedCount=placed.filter(x=>x===tk).length;
     const shown=q.shuffled.slice(0,i).filter(x=>x===tk).length;
     const disabled=shown<usedCount;
     return `<button class="wchip ${disabled?"used":""}" data-tk="${esc(tk)}" ${disabled?"disabled":""}>${esc(tk)}</button>`;
    }).join("")}</div>
   <div class="row"><button class="btn" id="undo">↩ ${esc(t("undo"))}</button></div>`;
 } else {
  const head = q.audio
   ? `<div style="text-align:center">
       <button class="audio" id="play" style="width:60px;height:60px;font-size:22px;margin:0 auto">▶</button>
       <p class="tiny muted" style="margin-top:10px">${esc(t("playOnce"))}</p></div>`
   : `<div class="hanzi" style="font-size:${q.type==="mean_hanzi"?"26px":"48px"};${q.type==="mean_hanzi"?"font-family:var(--ui);line-height:1.4":""}">${esc(q.prompt)}</div>
      ${q.sub?`<div class="pinyin">${esc(q.sub)}</div>`:""}`;
  body=`<div class="card" style="padding:26px 20px">${head}</div>
   <div style="margin-top:16px">${q.opts.map((o,k)=>
     `<button class="opt ${a===k?"right":""}" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
 }

 main.innerHTML=`
  <div class="exhead">
   <div style="display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:13px"><b style="font-family:var(--han)">${esc(SECNAME[q.sec])}</b>
      <span class="muted">${esc(t("sec_"+q.sec))}</span></span>
    <span id="clock" style="font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink-3)">--:--</span>
   </div>
   <div class="bar" style="margin-top:8px"><i style="width:${(exam.i+1)/n*100}%"></i></div>
   <div class="tiny muted" style="margin-top:5px">${exam.i+1} / ${n}</div>
  </div>
  ${body}
  <div class="row">
   <button class="btn" id="prevq" ${exam.i===0?"disabled":""}>←</button>
   <button class="btn solid" id="nextq">${exam.i===n-1?esc(t("submitExam")):esc(t("next"))}</button>
  </div>
  <div class="row"><button class="btn" id="quit" style="font-size:13px">${esc(t("quitExam"))}</button></div>`;

 tickTimer();

 if(q.audio){
  const p=main.querySelector("#play");
  p.onclick=()=>say(q.audio,false);
  setTimeout(()=>say(q.audio,false),350);          // ของจริงเปิดให้ฟังอัตโนมัติ
 }
 main.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
  exam.answers[exam.i]=+b.dataset.k; render();
 });
 main.querySelectorAll("[data-tk]").forEach(b=>b.onclick=()=>{
  const cur=Array.isArray(exam.answers[exam.i])?exam.answers[exam.i].slice():[];
  cur.push(b.dataset.tk); exam.answers[exam.i]=cur; render();
 });
 const u=main.querySelector("#undo");
 if(u) u.onclick=()=>{
  const cur=Array.isArray(exam.answers[exam.i])?exam.answers[exam.i].slice():[];
  cur.pop(); exam.answers[exam.i]=cur.length?cur:null; render();
 };
 main.querySelector("#prevq").onclick=()=>{ if(exam.i>0){exam.i--;render()} };
 main.querySelector("#nextq").onclick=()=>{
  if(exam.i<n-1){ exam.i++; render() } else finishExam();
 };
 main.querySelector("#quit").onclick=()=>askConfirm(t("quitAsk"),()=>{
  stopTimer(); exam=null; render();
 });
}

/* ---------- หน้าผลสอบ ---------- */
function vExamResult(){
 const r=examScore(), cfg=exam.cfg;
 const passed = cfg.pass===null ? null : r.total>=cfg.pass;
 const weakest=Object.entries(r.per).sort((a,b)=>a[1].score-b[1].score)[0];
 const wrong=exam.flat.map((q,i)=>({q,i})).filter(x=>!isRight(x.q,exam.answers[x.i]));

 main.innerHTML=`
  <p class="sec-label" style="margin-top:16px">${esc(t("result"))} · HSK ${exam.lv}</p>
  <div class="card" style="padding:26px 20px">
   <div style="font-size:40px;font-weight:600;line-height:1.1">${r.total}
     <span style="font-size:18px;color:var(--ink-3)">/ ${r.max}</span></div>
   ${passed===null
     ? `<div class="tiny muted" style="margin-top:8px">${esc(t("noOfficialPass"))}</div>`
     : `<div style="margin-top:10px;font-size:16px;color:${passed?"var(--jade)":"var(--seal)"}">
          ${passed?"✓ "+esc(t("passed")):"✕ "+esc(t("failed"))}
          <span class="tiny muted"> · ${esc(t("passMark"))} ${cfg.pass}</span></div>`}
  </div>
  <p class="sec-label">${esc(t("bySkill"))}</p>
  ${Object.entries(r.per).map(([k,v])=>`
   <div style="margin-bottom:13px">
    <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px">
     <span><b style="font-family:var(--han)">${esc(SECNAME[k])}</b> ${esc(t("sec_"+k))}</span>
     <span><b>${v.score}</b><span class="muted">/100 · ${v.ok}/${v.n}</span></span>
    </div>
    <div class="bar"><i style="width:${v.score}%;background:${v.score>=60?"var(--jade)":"var(--seal)"}"></i></div>
   </div>`).join("")}
  ${weakest?`<div class="note">${esc(t("weakest"))}: <b style="font-family:var(--han)">${esc(SECNAME[weakest[0]])}</b>
    ${esc(t("sec_"+weakest[0]))} — ${weakest[1].score}/100</div>`:""}
  ${wrong.length?`<p class="sec-label">${esc(t("wrongList"))} (${wrong.length})</p>`+
   wrong.slice(0,30).map(({q,i})=>{
    const yours=exam.answers[i];
    const right = q.type==="order" ? q.tokens.join(" ")
      : q.opts[q.ans];
    const mine = q.type==="order" ? (Array.isArray(yours)?yours.join(" "):"—")
      : (yours===null?"—":q.opts[yours]);
    const ask = q.type==="order" ? q.sentence : (q.audio||q.prompt);
    return `<div class="wcard"><div class="wmain" style="cursor:default;align-items:flex-start">
      <div style="flex:1;min-width:0">
       <div style="font-family:var(--han);font-size:17px">${esc(ask)}</div>
       <div class="tiny" style="color:var(--seal);margin-top:3px">✕ ${esc(mine)}</div>
       <div class="tiny" style="color:var(--jade)">✓ ${esc(right)}</div>
      </div></div></div>`;
   }).join(""):`<div class="note" style="background:var(--jade-soft);color:#1F4C3E">${esc(t("allCorrect"))}</div>`}
  <div class="row">
   <button class="btn" id="home2">${esc(t("back"))}</button>
   <button class="btn solid" id="again2">${esc(t("retry"))}</button>
  </div>`;
 main.querySelector("#again2").onclick=()=>{ exam=buildExam(S.level); render() };
 main.querySelector("#home2").onclick=()=>{ exam=null; view="home"; render() };
}



document.getElementById("lang").onchange=e=>{S.lang=e.target.value;document.documentElement.lang=S.lang;store.save(S);render()};
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{
 view=b.dataset.v;revealed=false;gOpen=null;backTo="home";
 if(typeof stopTimer==="function"){stopTimer();exam=null}
 if(view==="learn"){startLearn();return}
 render();
});
(async function(){
 const s=await store.load(); if(s)S=Object.assign(S,s);
 if(!S.custom)S.custom={};
 if(!S.wrong)S.wrong={};
 if(!S.exams)S.exams=[];
 document.getElementById("lang").value=S.lang;
 document.documentElement.lang=S.lang;
 render();
})();
</script>
</body>
</html>
