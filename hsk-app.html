{"t":"是","s":"A + 是 + B","th":"ใช้เชื่อม A กับ B ว่า A คือ B ปฏิเสธใช้ 不是 ห้ามใช้ 是 คู่กับคำคุณศัพท์","lo":"ໃຊ້ເຊື່ອມ A ກັບ B ວ່າ A ແມ່ນ B ປະຕິເສດໃຊ້ 不是","en":"Links two nouns: A is B. Negate with 不是. Never use 是 before an adjective.","ex":[["我是学生。","Wǒ shì xuésheng.","ฉันเป็นนักเรียน","ຂ້ອຍເປັນນັກຮຽນ","I am a student."],["他不是老师。","Tā bú shì lǎoshī.","เขาไม่ใช่ครู","ລາວບໍ່ແມ່ນຄູ","He is not a teacher."]],"bad":["我是很好。","我很好。","คำคุณศัพท์ไม่ต้องมี 是 นำหน้า ใช้ 很 แทน","ຄຳຄຸນນາມບໍ່ຕ້ອງມີ 是 ນຳໜ້າ ໃຊ້ 很 ແທນ"]},
{"t":"吗","s":"ประโยคบอกเล่า + 吗？","th":"เติม 吗 ท้ายประโยคบอกเล่าเพื่อทำให้เป็นคำถามใช่/ไม่ใช่ ลำดับคำไม่ต้องสลับ","lo":"ຕື່ມ 吗 ທ້າຍປະໂຫຍກເພື່ອເຮັດເປັນຄຳຖາມ ບໍ່ຕ້ອງສະຫຼັບລຳດັບຄຳ","en":"Add 吗 to a statement to make a yes/no question. Word order never changes.","ex":[["你是学生吗？","Nǐ shì xuésheng ma?","คุณเป็นนักเรียนใช่ไหม","ເຈົ້າເປັນນັກຮຽນບໍ?","Are you a student?"]],"bad":["你叫什么名字吗？","你叫什么名字？","ประโยคที่มีคำถามอยู่แล้ว (什么/谁/哪儿) ห้ามเติม 吗 ซ้ำ","ປະໂຫຍກທີ່ມີຄຳຖາມຢູ່ແລ້ວ ຫ້າມຕື່ມ 吗 ຊ້ຳ"]},
{"t":"有","s":"ผู้ครอบครอง + 有 + สิ่งของ","th":"แปลว่า มี ปฏิเสธต้องใช้ 没有 เท่านั้น ห้ามใช้ 不有 เด็ดขาด","lo":"ແປວ່າ ມີ ປະຕິເສດຕ້ອງໃຊ້ 没有 ເທົ່ານັ້ນ","en":"Means to have. The negative is always 没有, never 不有.","ex":[["我有三个朋友。","Wǒ yǒu sān ge péngyou.","ฉันมีเพื่อนสามคน","ຂ້ອຍມີໝູ່ສາມຄົນ","I have three friends."],["她没有钱。","Tā méiyǒu qián.","เธอไม่มีเงิน","ລາວບໍ່ມີເງິນ","She has no money."]],"bad":["我不有钱。","我没有钱。","有 ปฏิเสธด้วย 没 เสมอ ไม่ใช้ 不","有 ປະຕິເສດດ້ວຍ 没 ສະເໝີ"]},
{"t":"的","s":"เจ้าของ + 的 + สิ่งของ","th":"ใช้แสดงความเป็นเจ้าของ ถ้าเป็นคนใกล้ตัวหรือครอบครัวมักละ 的 ได้","lo":"ໃຊ້ສະແດງຄວາມເປັນເຈົ້າຂອງ ຖ້າເປັນຄົນໃກ້ໂຕມັກລະ 的 ໄດ້","en":"Marks possession. With family and close relations 的 is usually dropped.","ex":[["这是我的书。","Zhè shì wǒ de shū.","นี่คือหนังสือของฉัน","ນີ້ແມ່ນປຶ້ມຂອງຂ້ອຍ","This is my book."],["我妈妈很忙。","Wǒ māma hěn máng.","แม่ฉันยุ่งมาก","ແມ່ຂ້ອຍຫຍຸ້ງຫຼາຍ","My mother is very busy."]],"bad":["我的妈妈的名字","我妈妈的名字","ไม่ใส่ 的 ซ้อนกันหลายชั้นโดยไม่จำเป็น","ບໍ່ໃສ່ 的 ຊ້ອນກັນຫຼາຍຊັ້ນ"]},
{"t":"在","s":"ประธาน + 在 + สถานที่ + กริยา","th":"บอกว่าอยู่ที่ไหน ถ้ามีกริยาตามมา 在 + สถานที่ ต้องวางไว้หน้ากริยาเสมอ ต่างจากภาษาไทยที่วางท้าย","lo":"ບອກວ່າຢູ່ໃສ ຖ້າມີກະລິຍາຕາມມາ ຕ້ອງວາງໄວ້ໜ້າກະລິຍາ","en":"States location. When a verb follows, 在 + place goes before the verb, unlike Thai.","ex":[["我在学校。","Wǒ zài xuéxiào.","ฉันอยู่ที่โรงเรียน","ຂ້ອຍຢູ່ໂຮງຮຽນ","I am at school."],["我在家吃饭。","Wǒ zài jiā chīfàn.","ฉันกินข้าวที่บ้าน","ຂ້ອຍກິນເຂົ້າຢູ່ບ້ານ","I eat at home."]],"bad":["我吃饭在家。","我在家吃饭。","สถานที่ต้องมาก่อนกริยา","ສະຖານທີ່ຕ້ອງມາກ່ອນກະລິຍາ"]},
{"t":"了","s":"กริยา + 了 / ประโยค + 了","th":"บอกว่าเหตุการณ์เกิดขึ้นแล้ว หรือสถานการณ์เปลี่ยนไป ไม่ใช่ past tense เสมอไป","lo":"ບອກວ່າເຫດການເກີດຂຶ້ນແລ້ວ ຫຼື ສະຖານະການປ່ຽນໄປ","en":"Marks a completed action or a change of state. It is not simply a past tense.","ex":[["我吃了三个。","Wǒ chī le sān ge.","ฉันกินไปสามชิ้นแล้ว","ຂ້ອຍກິນໄປສາມອັນແລ້ວ","I ate three."],["下雨了。","Xià yǔ le.","ฝนตกแล้ว","ຝົນຕົກແລ້ວ","It has started raining."]],"bad":["我没吃了。","我没吃。","ประโยคปฏิเสธด้วย 没 ห้ามมี 了","ປະໂຫຍກປະຕິເສດດ້ວຍ 没 ຫ້າມມີ 了"]},
{"t":"不 / 没","s":"不 + กริยา/คุณศัพท์ · 没 + 有/กริยาที่เกิดไปแล้ว","th":"两 คำนี้แปลว่า ไม่ เหมือนกัน แต่ 不 ใช้ปฏิเสธเรื่องปัจจุบัน อนาคต นิสัย และความตั้งใจ ส่วน 没 ใช้ปฏิเสธว่าเหตุการณ์ยังไม่เกิดขึ้น หรือไม่มีอยู่","lo":"ສອງຄຳນີ້ແປວ່າ ບໍ່ ຄືກັນ ແຕ່ 不 ໃຊ້ປະຕິເສດເລື່ອງປັດຈຸບັນ ອະນາຄົດ ນິໄສ ສ່ວນ 没 ໃຊ້ປະຕິເສດວ່າເຫດການຍັງບໍ່ເກີດ","en":"不 negates the present, future, habits and intentions. 没 negates completed events and possession.","ex":[["我不喝咖啡。","Wǒ bù hē kāfēi.","ฉันไม่ดื่มกาแฟ (เป็นนิสัย)","ຂ້ອຍບໍ່ດື່ມກາເຟ","I don't drink coffee."],["我没喝咖啡。","Wǒ méi hē kāfēi.","ฉันยังไม่ได้ดื่มกาแฟ","ຂ້ອຍຍັງບໍ່ໄດ້ດື່ມກາເຟ","I haven't drunk coffee."]],"bad":["我不有钱。","我没有钱。","有 ปฏิเสธด้วย 没 เสมอ ห้ามใช้ 不 เด็ดขาด","有 ປະຕິເສດດ້ວຍ 没 ສະເໝີ ຫ້າມໃຊ້ 不"]},
{"t":"几 / 多少","s":"几 + ลักษณนาม + นาม (น้อยกว่า 10) · 多少 + นาม (ไม่จำกัด)","th":"几 ใช้ถามจำนวนที่คาดว่าน้อยกว่าสิบ และต้องมีลักษณนามตามหลังเสมอ ส่วน 多少 ถามจำนวนเท่าไหร่ก็ได้ และจะมีลักษณนามหรือไม่ก็ได้","lo":"几 ໃຊ້ຖາມຈຳນວນທີ່ຄາດວ່າໜ້ອຍກວ່າສິບ ແລະ ຕ້ອງມີລັກສະນະນາມຕາມຫຼັງ ສ່ວນ 多少 ຖາມຈຳນວນເທົ່າໃດກໍໄດ້","en":"几 asks about a small number (under ten) and needs a measure word. 多少 asks about any amount.","ex":[["你家有几个人？","Nǐ jiā yǒu jǐ ge rén?","ครอบครัวคุณมีกี่คน","ຄອບຄົວເຈົ້າມີຈັກຄົນ?","How many people are in your family?"],["这个多少钱？","Zhège duōshao qián?","อันนี้ราคาเท่าไหร่","ອັນນີ້ລາຄາເທົ່າໃດ?","How much is this?"]],"bad":["你有几人？","你有几个人？","หลัง 几 ต้องมีลักษณนามเสมอ ห้ามข้าม","ຫຼັງ 几 ຕ້ອງມີລັກສະນະນາມສະເໝີ"]},
{"t":"也 / 都","s":"ประธาน + 也/都 + กริยา","th":"也 แปลว่า ก็...ด้วย ส่วน 都 แปลว่า ล้วน / ทั้งหมด ทั้งสองคำต้องวางไว้หน้ากริยาเสมอ ห้ามวางท้ายประโยคแบบภาษาไทย","lo":"也 ແປວ່າ ກໍ...ນຳ ສ່ວນ 都 ແປວ່າ ລ້ວນ / ທັງໝົດ ທັງສອງຄຳຕ້ອງວາງໄວ້ໜ້າກະລິຍາສະເໝີ","en":"也 = also, too. 都 = all, both. Both must go before the verb, never at the end.","ex":[["我也是学生。","Wǒ yě shì xuésheng.","ฉันก็เป็นนักเรียนเหมือนกัน","ຂ້ອຍກໍເປັນນັກຮຽນຄືກັນ","I'm a student too."],["我们都喜欢中文。","Wǒmen dōu xǐhuan Zhōngwén.","พวกเราชอบภาษาจีนกันทุกคน","ພວກເຮົາມັກພາສາຈີນທຸກຄົນ","We all like Chinese."]],"bad":["我是学生也。","我也是学生。","也 ต้องอยู่หน้ากริยา ไม่ใช่ท้ายประโยคแบบภาษาไทย","也 ຕ້ອງຢູ່ໜ້າກະລິຍາ ບໍ່ແມ່ນທ້າຍປະໂຫຍກ"]},
{"t":"呢","s":"คำนาม/สรรพนาม + 呢？","th":"ใช้ถามย้อนกลับว่า แล้ว...ล่ะ โดยไม่ต้องพูดคำถามเต็มประโยคซ้ำ และยังใช้ต่อท้ายเพื่อถามว่าอยู่ไหนได้ด้วย","lo":"ໃຊ້ຖາມຍ້ອນກັບວ່າ ແລ້ວ...ເດ ໂດຍບໍ່ຕ້ອງເວົ້າຄຳຖາມເຕັມປະໂຫຍກຊ້ຳ","en":"Bounces a question back: and you? It can also ask where something is.","ex":[["我很好，你呢？","Wǒ hěn hǎo, nǐ ne?","ฉันสบายดี แล้วคุณล่ะ","ຂ້ອຍສະບາຍດີ ແລ້ວເຈົ້າເດ?","I'm fine, and you?"],["我的书呢？","Wǒ de shū ne?","หนังสือฉันอยู่ไหน","ປຶ້ມຂ້ອຍຢູ່ໃສ?","Where is my book?"]],"bad":["你呢好吗？","你好吗？","呢 ใช้ต่อท้ายคำที่ต้องการถามย้อน ไม่ใช่แทรกกลางประโยค","呢 ໃຊ້ຕໍ່ທ້າຍ ບໍ່ແມ່ນແຊກກາງປະໂຫຍກ"]},
{"t":"和","s":"คำนาม + 和 + คำนาม","th":"和 แปลว่า และ แต่ใช้เชื่อมได้เฉพาะคำนามหรือสรรพนามเท่านั้น ห้ามใช้เชื่อมสองประโยคหรือสองกริยาแบบภาษาไทย","lo":"和 ແປວ່າ ແລະ ແຕ່ໃຊ້ເຊື່ອມໄດ້ສະເພາະຄຳນາມເທົ່ານັ້ນ ຫ້າມໃຊ້ເຊື່ອມສອງປະໂຫຍກ","en":"和 joins nouns or pronouns only — never two clauses or two verbs.","ex":[["我和他是朋友。","Wǒ hé tā shì péngyou.","ฉันกับเขาเป็นเพื่อนกัน","ຂ້ອຍກັບລາວເປັນໝູ່ກັນ","He and I are friends."],["我买了茶和水果。","Wǒ mǎi le chá hé shuǐguǒ.","ฉันซื้อชากับผลไม้","ຂ້ອຍຊື້ຊາກັບໝາກໄມ້","I bought tea and fruit."]],"bad":["我吃饭和看电视。","我吃饭，看电视。","和 เชื่อมกริยาไม่ได้ ใช้เว้นวรรคหรือ 一边…一边… แทน","和 ເຊື່ອມກະລິຍາບໍ່ໄດ້"]},
{"t":"太……了","s":"太 + คำคุณศัพท์ + 了","th":"แปลว่า ...เกินไป หรือ ...มากเลย ต้องมี 了 ปิดท้ายเสมอ ถ้าจะปฏิเสธใช้ 不太 ซึ่งแปลว่า ไม่ค่อย","lo":"ແປວ່າ ...ເກີນໄປ ຫຼື ...ຫຼາຍເລີຍ ຕ້ອງມີ 了 ປິດທ້າຍສະເໝີ","en":"Means too… or so… — the 了 at the end is required. The negative 不太 means not very.","ex":[["这个太贵了！","Zhège tài guì le!","อันนี้แพงเกินไป!","ອັນນີ້ແພງເກີນໄປ!","This is too expensive!"],["今天不太热。","Jīntiān bú tài rè.","วันนี้ไม่ค่อยร้อน","ມື້ນີ້ບໍ່ຄ່ອຍຮ້ອນ","It's not very hot today."]],"bad":["这个太贵。","这个太贵了。","太 ต้องมี 了 ปิดท้าย","太 ຕ້ອງມີ 了 ປິດທ້າຍ"]},
{"t":"数词 + 量词 + 名词","s":"ตัวเลข + ลักษณนาม + คำนาม","th":"ภาษาจีนนับของต้องมีลักษณนามคั่นเสมอ ห้ามพูดตัวเลขติดคำนามตรงๆ แบบภาษาไทย ถ้าไม่รู้ว่าคำไหนใช้ลักษณนามอะไร ให้ใช้ 个 ไปก่อน","lo":"ພາສາຈີນນັບຂອງຕ້ອງມີລັກສະນະນາມຄັ່ນສະເໝີ ຖ້າບໍ່ຮູ້ວ່າໃຊ້ອັນໃດ ໃຫ້ໃຊ້ 个 ໄປກ່ອນ","en":"Chinese always needs a measure word between the number and the noun. When unsure, 个 is the safe default.","ex":[["三个人","sān ge rén","สามคน","ສາມຄົນ","three people"],["两本书","liǎng běn shū","หนังสือสองเล่ม","ປຶ້ມສອງຫົວ","two books"]],"bad":["二本书","两本书","เลข 2 หน้าลักษณนามต้องใช้ 两 ไม่ใช่ 二","ເລກ 2 ໜ້າລັກສະນະນາມຕ້ອງໃຊ້ 两"]},
{"t":"想 / 要","s":"想/要 + กริยา","th":"想 แปลว่า อยากจะ (ความปรารถนา) ส่วน 要 หนักแน่นกว่า แปลว่า จะ หรือ ต้องการจะ ปฏิเสธของ 要 ต้องใช้ 不想 ไม่ใช่ 不要 เพราะ 不要 แปลว่า อย่า","lo":"想 ແປວ່າ ຢາກຈະ ສ່ວນ 要 ໜັກແໜ້ນກວ່າ ປະຕິເສດຕ້ອງໃຊ້ 不想 ເພາະ 不要 ແປວ່າ ຢ່າ","en":"想 = would like to; 要 = will / want to (stronger). The negative is 不想 — 不要 means don't!","ex":[["我想去中国。","Wǒ xiǎng qù Zhōngguó.","ฉันอยากไปประเทศจีน","ຂ້ອຍຢາກໄປປະເທດຈີນ","I'd like to go to China."],["我不想吃。","Wǒ bù xiǎng chī.","ฉันไม่อยากกิน","ຂ້ອຍບໍ່ຢາກກິນ","I don't want to eat."]],"bad":["我不要吃。(ตั้งใจจะบอกว่าไม่อยากกิน)","我不想吃。","不要 แปลว่า อย่า เป็นคำสั่งห้าม ไม่ใช่ ไม่อยาก","不要 ແປວ່າ ຢ່າ ບໍ່ແມ່ນ ບໍ່ຢາກ"]}
],
2:[
{"t":"过","s":"กริยา + 过","th":"บอกประสบการณ์ว่าเคยทำ ต่างจาก 了 ที่บอกว่าทำเสร็จ ปฏิเสธใช้ 没…过","lo":"ບອກປະສົບການວ່າເຄີຍເຮັດ ຕ່າງຈາກ 了","en":"Marks past experience — done at least once. Negate with 没…过.","ex":[["我去过中国。","Wǒ qù guo Zhōngguó.","ฉันเคยไปจีน","ຂ້ອຍເຄີຍໄປຈີນ","I have been to China."],["他没吃过。","Tā méi chī guo.","เขาไม่เคยกิน","ລາວບໍ່ເຄີຍກິນ","He has never eaten it."]],"bad":["我不去过中国。","我没去过中国。","过 ปฏิเสธด้วย 没 ไม่ใช่ 不","过 ປະຕິເສດດ້ວຍ 没 ບໍ່ແມ່ນ 不"]},
{"t":"比","s":"A + 比 + B + คำคุณศัพท์","th":"ใช้เปรียบเทียบ ห้ามใส่ 很 หน้าคำคุณศัพท์ ถ้าจะบอกว่ามากกว่าเท่าไหร่ ให้ใส่ไว้ท้ายสุด","lo":"ໃຊ້ປຽບທຽບ ຫ້າມໃສ່ 很 ໜ້າຄຳຄຸນນາມ","en":"Comparison. Never put 很 before the adjective. Degree of difference goes at the end.","ex":[["他比我高。","Tā bǐ wǒ gāo.","เขาสูงกว่าฉัน","ລາວສູງກວ່າຂ້ອຍ","He is taller than me."],["他比我大两岁。","Tā bǐ wǒ dà liǎng suì.","เขาแก่กว่าฉันสองปี","ລາວແກ່ກວ່າຂ້ອຍສອງປີ","He is two years older."]],"bad":["他比我很高。","他比我高。","ในประโยค 比 ห้ามมี 很","ໃນປະໂຫຍກ 比 ຫ້າມມີ 很"]},
{"t":"因为……所以……","s":"因为 + เหตุ，所以 + ผล","th":"ภาษาจีนใช้ทั้งคู่พร้อมกันได้ ต่างจากภาษาอังกฤษที่เลือกใช้ตัวเดียว","lo":"ພາສາຈີນໃຊ້ຄູ່ກັນໄດ້ທັງສອງໂຕ","en":"Chinese uses both halves together, unlike English which picks one.","ex":[["因为下雨，所以我没去。","Yīnwèi xià yǔ, suǒyǐ wǒ méi qù.","เพราะฝนตก ฉันเลยไม่ได้ไป","ຍ້ອນຝົນຕົກ ຂ້ອຍເລີຍບໍ່ໄດ້ໄປ","It rained, so I didn't go."]],"bad":["因为下雨，我没去所以。","因为下雨，所以我没去。","所以 ต้องอยู่ต้นประโยคหลัง ไม่ใช่ท้าย","所以 ຕ້ອງຢູ່ຕົ້ນປະໂຫຍກຫຼັງ"]},
{"t":"还是 / 或者","s":"คำถาม → 还是 · บอกเล่า → 或者","th":"สองคำนี้แปลว่า หรือ เหมือนกัน แต่ 还是 ใช้ในประโยคคำถามเท่านั้น ส่วน 或者 ใช้ในประโยคบอกเล่า","lo":"ສອງຄຳນີ້ແປວ່າ ຫຼື ຄືກັນ ແຕ່ 还是 ໃຊ້ໃນຄຳຖາມເທົ່ານັ້ນ","en":"Both mean or. 还是 is for questions; 或者 is for statements.","ex":[["你喝茶还是喝水？","Nǐ hē chá háishi hē shuǐ?","คุณจะดื่มชาหรือน้ำ","ເຈົ້າຈະດື່ມຊາ ຫຼື ນ້ຳ?","Tea or water?"],["我喝茶或者水都行。","Wǒ hē chá huòzhě shuǐ dōu xíng.","ฉันดื่มชาหรือน้ำก็ได้","ຂ້ອຍດື່ມຊາ ຫຼື ນ້ຳ ກໍໄດ້","Either tea or water is fine."]],"bad":["你喝茶或者水？","你喝茶还是水？","ในคำถามต้องใช้ 还是","ໃນຄຳຖາມຕ້ອງໃຊ້ 还是"]},
{"t":"正在……呢","s":"正在 + กริยา + 呢","th":"บอกว่ากำลังทำอยู่ในขณะนั้น จะใช้แค่ 在 หรือ 正在 ก็ได้ ส่วน 呢 ท้ายประโยคช่วยเสริมน้ำเสียง","lo":"ບອກວ່າກຳລັງເຮັດຢູ່ໃນຂະນະນັ້ນ","en":"Action in progress. 在 alone works; 呢 softens the tone.","ex":[["我正在学习呢。","Wǒ zhèngzài xuéxí ne.","ฉันกำลังเรียนอยู่","ຂ້ອຍກຳລັງຮຽນຢູ່","I'm studying right now."]],"bad":["我正在学习了。","我正在学习呢。","กำลังทำอยู่ ห้ามลงท้ายด้วย 了","ກຳລັງເຮັດຢູ່ ຫ້າມລົງທ້າຍດ້ວຍ 了"]},
{"t":"会 / 能 / 可以","s":"会 = ทักษะที่เรียนมา · 能 = ความสามารถหรือเงื่อนไข · 可以 = ได้รับอนุญาต","th":"สามคำนี้แปลว่า ได้ เหมือนกันในภาษาไทย แต่ภาษาจีนแยกความหมายชัดเจน ต้องเลือกให้ตรง","lo":"ສາມຄຳນີ້ແປວ່າ ໄດ້ ຄືກັນ ແຕ່ຈີນແຍກຄວາມໝາຍຊັດເຈນ","en":"会 = learned skill, 能 = ability or circumstance, 可以 = permission.","ex":[["我会说中文。","Wǒ huì shuō Zhōngwén.","ฉันพูดจีนได้ (เรียนมา)","ຂ້ອຍເວົ້າຈີນໄດ້ (ຮຽນມາ)","I can speak Chinese."],["我今天不能去。","Wǒ jīntiān bù néng qù.","วันนี้ฉันไปไม่ได้ (ติดธุระ)","ມື້ນີ້ຂ້ອຍໄປບໍ່ໄດ້","I can't go today."],["可以进来吗？","Kěyǐ jìnlái ma?","เข้าไปได้ไหม","ເຂົ້າໄປໄດ້ບໍ?","May I come in?"]],"bad":["我能说中文。","我会说中文。","ทักษะที่เรียนมาใช้ 会","ທັກສະທີ່ຮຽນມາໃຊ້ 会"]},
{"t":"一点儿 / 有点儿","s":"คุณศัพท์ + 一点儿 · 有点儿 + คุณศัพท์","th":"สองคำนี้แปลว่า นิดหน่อย เหมือนกัน แต่ 有点儿 วางไว้หน้าคำคุณศัพท์ และใช้กับเรื่องที่ผู้พูดไม่พอใจ ส่วน 一点儿 วางไว้หลัง ใช้เปรียบเทียบหรือขอปรับเล็กน้อย","lo":"ສອງຄຳນີ້ແປວ່າ ໜ້ອຍໜຶ່ງ ຄືກັນ ແຕ່ 有点儿 ວາງໜ້າຄຳຄຸນນາມ ໃຊ້ກັບເລື່ອງທີ່ບໍ່ພໍໃຈ ສ່ວນ 一点儿 ວາງຫຼັງ","en":"有点儿 goes before the adjective and carries a complaint. 一点儿 goes after and is neutral.","ex":[["这个有点儿贵。","Zhège yǒudiǎnr guì.","อันนี้แพงไปหน่อย (ไม่พอใจ)","ອັນນີ້ແພງໄປໜ້ອຍ","This is a bit too expensive."],["便宜一点儿吧。","Piányi yìdiǎnr ba.","ลดราคาหน่อยสิ","ຫຼຸດລາຄາໜ້ອຍໜຶ່ງແດ່","Make it a bit cheaper."]],"bad":["这个一点儿贵。","这个有点儿贵。","บ่นว่าแพงไป ต้องใช้ 有点儿 วางไว้หน้าคำคุณศัพท์","ຈົ່ມວ່າແພງໄປ ຕ້ອງໃຊ້ 有点儿 ວາງໄວ້ໜ້າ"]},
{"t":"就 / 才","s":"เวลา + 就/才 + กริยา","th":"就 สื่อว่าเร็วกว่าที่คาด ง่ายกว่าที่คิด ส่วน 才 สื่อว่าช้ากว่าที่คาด หรือกว่าจะได้ก็ยาก เป็นการแสดงทัศนคติของผู้พูด ไม่ใช่แค่บอกเวลา","lo":"就 ສື່ວ່າໄວກວ່າທີ່ຄາດ ສ່ວນ 才 ສື່ວ່າຊ້າກວ່າທີ່ຄາດ ເປັນການສະແດງທັດສະນະຂອງຜູ້ເວົ້າ","en":"就 means sooner or easier than expected; 才 means later or harder than expected.","ex":[["他六点就来了。","Tā liù diǎn jiù lái le.","เขามาตั้งแต่หกโมง (เร็วกว่าที่คิด)","ລາວມາແຕ່ຫົກໂມງ","He came as early as six."],["他九点才来。","Tā jiǔ diǎn cái lái.","กว่าเขาจะมาก็เก้าโมง (ช้า)","ກວ່າລາວຈະມາກໍເກົ້າໂມງ","He didn't come until nine."]],"bad":["他九点就来，太晚了。","他九点才来，太晚了。","บ่นว่าช้าต้องใช้ 才 ไม่ใช่ 就","ຈົ່ມວ່າຊ້າຕ້ອງໃຊ້ 才"]},
{"t":"动词 + 得 + 形容词","s":"กริยา + 得 + คำคุณศัพท์","th":"ใช้บอกว่าทำสิ่งนั้นได้ดีแค่ไหน ถ้ากริยามีกรรมตามหลัง ต้องพูดกริยาซ้ำอีกครั้งก่อนใส่ 得 เช่น 说中文说得很好","lo":"ໃຊ້ບອກວ່າເຮັດສິ່ງນັ້ນໄດ້ດີປານໃດ ຖ້າກະລິຍາມີກຳຕາມຫຼັງ ຕ້ອງເວົ້າກະລິຍາຊ້ຳອີກເທື່ອກ່ອນໃສ່ 得","en":"States how well an action is done. If the verb has an object, repeat the verb before 得.","ex":[["他跑得很快。","Tā pǎo de hěn kuài.","เขาวิ่งได้เร็วมาก","ລາວແລ່ນໄດ້ໄວຫຼາຍ","He runs very fast."],["他说中文说得很好。","Tā shuō Zhōngwén shuō de hěn hǎo.","เขาพูดภาษาจีนได้ดีมาก","ລາວເວົ້າພາສາຈີນໄດ້ດີຫຼາຍ","He speaks Chinese very well."]],"bad":["他说中文得很好。","他说中文说得很好。","มีกรรมแล้วต้องพูดกริยาซ้ำก่อน 得","ມີກຳແລ້ວຕ້ອງເວົ້າກະລິຍາຊ້ຳກ່ອນ 得"]},
{"t":"从……到……","s":"从 + จุดเริ่ม + 到 + จุดสิ้นสุด","th":"ใช้บอกช่วงจากที่หนึ่งถึงอีกที่หนึ่ง หรือจากเวลาหนึ่งถึงอีกเวลาหนึ่ง ทั้งก้อนต้องวางไว้หน้ากริยา","lo":"ໃຊ້ບອກຊ່ວງຈາກບ່ອນໜຶ່ງເຖິງອີກບ່ອນໜຶ່ງ ຫຼື ຈາກເວລາໜຶ່ງເຖິງອີກເວລາໜຶ່ງ","en":"From X to Y, for both place and time. The whole phrase goes before the verb.","ex":[["我从九点到五点工作。","Wǒ cóng jiǔ diǎn dào wǔ diǎn gōngzuò.","ฉันทำงานตั้งแต่เก้าโมงถึงห้าโมง","ຂ້ອຍເຮັດວຽກແຕ່ເກົ້າໂມງຮອດຫ້າໂມງ","I work from nine to five."],["从这儿到学校很近。","Cóng zhèr dào xuéxiào hěn jìn.","จากที่นี่ไปโรงเรียนใกล้มาก","ຈາກບ່ອນນີ້ໄປໂຮງຮຽນໃກ້ຫຼາຍ","It's close from here to school."]],"bad":["我工作从九点到五点。","我从九点到五点工作。","ช่วงเวลาต้องมาก่อนกริยา","ຊ່ວງເວລາຕ້ອງມາກ່ອນກະລິຍາ"]},
{"t":"离","s":"A + 离 + B + ไกล/ใกล้","th":"ใช้บอกระยะห่างระหว่างสองจุด ต่างจาก 从 ที่บอกจุดเริ่มต้นของการเคลื่อนที่ 离 ไม่ได้บอกว่าเดินทางไปไหน แค่บอกว่าห่างกันแค่ไหน","lo":"ໃຊ້ບອກໄລຍະຫ່າງລະຫວ່າງສອງຈຸດ ຕ່າງຈາກ 从 ທີ່ບອກຈຸດເລີ່ມຕົ້ນຂອງການເຄື່ອນທີ່","en":"States the distance between two points — unlike 从, which marks a starting point of movement.","ex":[["我家离学校很远。","Wǒ jiā lí xuéxiào hěn yuǎn.","บ้านฉันอยู่ไกลจากโรงเรียนมาก","ບ້ານຂ້ອຍຢູ່ໄກຈາກໂຮງຮຽນຫຼາຍ","My home is far from school."],["离考试还有三天。","Lí kǎoshì hái yǒu sān tiān.","อีกสามวันจะสอบแล้ว","ອີກສາມມື້ຈະສອບເສັງແລ້ວ","There are three days left until the exam."]],"bad":["我家从学校很远。","我家离学校很远。","บอกระยะห่างใช้ 离 ไม่ใช่ 从","ບອກໄລຍະຫ່າງໃຊ້ 离 ບໍ່ແມ່ນ 从"]},
{"t":"别 / 不要","s":"别 + กริยา + 了","th":"ใช้ห้ามไม่ให้ทำ แปลว่า อย่า ถ้าเติม 了 ท้ายประโยคจะหมายถึงให้หยุดทำสิ่งที่กำลังทำอยู่","lo":"ໃຊ້ຫ້າມບໍ່ໃຫ້ເຮັດ ແປວ່າ ຢ່າ ຖ້າຕື່ມ 了 ທ້າຍປະໂຫຍກໝາຍເຖິງໃຫ້ຢຸດເຮັດສິ່ງທີ່ກຳລັງເຮັດຢູ່","en":"Don't… Adding 了 at the end means stop doing what you're already doing.","ex":[["别忘了带护照。","Bié wàng le dài hùzhào.","อย่าลืมพกพาสปอร์ตนะ","ຢ່າລືມເອົາໜັງສືຜ່ານແດນ","Don't forget your passport."],["别说话了！","Bié shuōhuà le!","หยุดพูดได้แล้ว!","ຢຸດເວົ້າໄດ້ແລ້ວ!","Stop talking!"]],"bad":["不别说话。","别说话。","别 เป็นคำห้ามอยู่แล้ว ห้ามใส่ 不 ซ้ำ","别 ເປັນຄຳຫ້າມຢູ່ແລ້ວ ຫ້າມໃສ່ 不 ຊ້ຳ"]},
{"t":"要……了","s":"(快)要 + กริยา + 了","th":"บอกว่าเหตุการณ์กำลังจะเกิดขึ้นในไม่ช้า จะใส่ 快 หรือ 就 ข้างหน้าเพื่อเน้นความใกล้ก็ได้ ประโยคนี้ต้องมี 了 ปิดท้ายเสมอ","lo":"ບອກວ່າເຫດການກຳລັງຈະເກີດຂຶ້ນໃນບໍ່ຊ້າ ຕ້ອງມີ 了 ປິດທ້າຍສະເໝີ","en":"Something is about to happen. 快 or 就 can be added for emphasis; the final 了 is required.","ex":[["火车要开了。","Huǒchē yào kāi le.","รถไฟกำลังจะออกแล้ว","ລົດໄຟກຳລັງຈະອອກແລ້ວ","The train is about to leave."],["快要下雨了。","Kuài yào xià yǔ le.","ฝนใกล้จะตกแล้ว","ຝົນໃກ້ຈະຕົກແລ້ວ","It's about to rain."]],"bad":["火车要开。","火车要开了。","โครงสร้างนี้ขาด 了 ท้ายประโยคไม่ได้","ໂຄງສ້າງນີ້ຂາດ 了 ທ້າຍປະໂຫຍກບໍ່ໄດ້"]},
{"t":"正反疑问句 (去不去)","s":"กริยา/คุณศัพท์ + 不 + กริยา/คุณศัพท์ ตัวเดิม","th":"คำถามอีกแบบที่ใช้แทน 吗 ได้ โดยพูดคำเดิมซ้ำแล้วคั่นด้วย 不 ตรงกลาง คนจีนใช้แบบนี้บ่อยพอๆ กับ 吗 เลย แต่ห้ามใส่ 吗 ซ้ำ","lo":"ຄຳຖາມອີກແບບທີ່ໃຊ້ແທນ 吗 ໄດ້ ໂດຍເວົ້າຄຳເດີມຊ້ຳແລ້ວຄັ່ນດ້ວຍ 不 ຢູ່ກາງ ຫ້າມໃສ່ 吗 ຊ້ຳ","en":"An alternative to 吗: repeat the verb or adjective with 不 in between. Never add 吗 as well.","ex":[["你去不去？","Nǐ qù bu qù?","คุณจะไปไหม","ເຈົ້າຈະໄປບໍ?","Are you going?"],["这个好不好吃？","Zhège hǎo bu hǎochī?","อันนี้อร่อยไหม","ອັນນີ້ແຊບບໍ?","Is this tasty?"]],"bad":["你去不去吗？","你去不去？","รูปนี้เป็นคำถามอยู่แล้ว ห้ามเติม 吗 ซ้ำ","ຮູບນີ້ເປັນຄຳຖາມຢູ່ແລ້ວ ຫ້າມຕື່ມ 吗 ຊ້ຳ"]},
{"t":"吧","s":"ประโยค + 吧","th":"มีสองหน้าที่ อย่างแรกใช้ชวนหรือเสนอแนะแบบนุ่มนวล อย่างที่สองใช้เดาว่าน่าจะเป็นอย่างนั้น ต่างจาก 吗 ที่ถามเพราะไม่รู้จริงๆ","lo":"ມີສອງໜ້າທີ່ ຢ່າງທຳອິດໃຊ້ຊວນຫຼືສະເໜີແບບນຸ້ມນວນ ຢ່າງທີສອງໃຊ້ເດົາວ່າໜ້າຈະເປັນແນວນັ້ນ","en":"Two jobs: a soft suggestion, or a guess you expect to be confirmed. Unlike 吗, which is a genuine question.","ex":[["我们走吧。","Wǒmen zǒu ba.","พวกเราไปกันเถอะ","ພວກເຮົາໄປກັນເທາະ","Let's go."],["你是老师吧？","Nǐ shì lǎoshī ba?","คุณเป็นครูใช่ไหม (เดาว่าใช่)","ເຈົ້າເປັນຄູແມ່ນບໍ?","You're a teacher, right?"]],"bad":["我们走吗。","我们走吧。","ชักชวนต้องใช้ 吧 ไม่ใช่ 吗","ຊັກຊວນຕ້ອງໃຊ້ 吧 ບໍ່ແມ່ນ 吗"]},
{"t":"给","s":"给 + คน + กริยา  ·  กริยา + 给 + คน","th":"ใช้ระบุว่าทำสิ่งนั้นให้ใคร วางไว้หน้ากริยาเสมอเมื่อแปลว่า ให้แก่ ต่างจากภาษาไทยที่พูดว่า โทรหาเขา แต่จีนต้องพูดว่า ให้เขา-โทร","lo":"ໃຊ້ລະບຸວ່າເຮັດສິ່ງນັ້ນໃຫ້ໃຜ ວາງໄວ້ໜ້າກະລິຍາສະເໝີ ຕ່າງຈາກພາສາລາວ","en":"Marks the beneficiary of an action and goes before the verb — unlike English word order.","ex":[["我给你打电话。","Wǒ gěi nǐ dǎ diànhuà.","ฉันจะโทรหาคุณ","ຂ້ອຍຈະໂທຫາເຈົ້າ","I'll call you."],["请给我一杯水。","Qǐng gěi wǒ yì bēi shuǐ.","ขอน้ำหนึ่งแก้ว","ຂໍນ້ຳຈອກໜຶ່ງ","Please give me a glass of water."]],"bad":["我打电话给你。(ในภาษาจีนมาตรฐาน)","我给你打电话。","จีนกลางวาง 给 + คน ไว้หน้ากริยา","ຈີນກາງວາງ 给 + ຄົນ ໄວ້ໜ້າກະລິຍາ"]},
{"t":"动词重叠 (看看)","s":"กริยา + กริยา  ·  กริยา + 一 + กริยา","th":"พูดกริยาซ้ำสองครั้งเพื่อทำให้น้ำเสียงนุ่มลง แปลประมาณว่า ลอง…ดูหน่อย หรือ …สักหน่อย เป็นสิ่งที่คนจีนใช้ตลอดเวลาเพื่อไม่ให้ฟังดูสั่ง","lo":"ເວົ້າກະລິຍາຊ້ຳສອງເທື່ອເພື່ອເຮັດໃຫ້ນ້ຳສຽງນຸ້ມລົງ ແປປະມານວ່າ ລອງ…ເບິ່ງແດ່","en":"Doubling a verb softens the tone — have a look, try it out. Native speakers use this constantly to sound less blunt.","ex":[["你看看这个。","Nǐ kànkan zhège.","ลองดูอันนี้หน่อยสิ","ລອງເບິ່ງອັນນີ້ແດ່","Have a look at this."],["我想休息一下。","Wǒ xiǎng xiūxi yíxià.","ฉันอยากพักสักหน่อย","ຂ້ອຍຢາກພັກໜ້ອຍໜຶ່ງ","I'd like to rest a bit."]],"bad":["你看这个！(กับผู้ใหญ่หรือคนไม่สนิท)","你看看这个。","พูดซ้ำทำให้สุภาพขึ้นมาก","ເວົ້າຊ້ຳເຮັດໃຫ້ສຸພາບຂຶ້ນ"]},
{"t":"有的……有的……","s":"有的 + …，有的 + …","th":"ใช้แจกแจงว่าในกลุ่มเดียวกัน บางส่วนเป็นแบบหนึ่ง บางส่วนเป็นอีกแบบ ต่างจาก 一些 ที่แค่บอกว่าจำนวนหนึ่ง","lo":"ໃຊ້ແຈກແຈງວ່າໃນກຸ່ມດຽວກັນ ບາງສ່ວນເປັນແບບໜຶ່ງ ບາງສ່ວນເປັນອີກແບບ","en":"Some… others… — splits one group into contrasting parts.","ex":[["有的人喜欢茶，有的人喜欢咖啡。","Yǒude rén xǐhuan chá, yǒude rén xǐhuan kāfēi.","บางคนชอบชา บางคนชอบกาแฟ","ບາງຄົນມັກຊາ ບາງຄົນມັກກາເຟ","Some like tea, others like coffee."]],"bad":["有的人喜欢茶，有人喜欢咖啡。","有的人喜欢茶，有的人喜欢咖啡。","ใช้เป็นคู่ ต้องเป็น 有的 ทั้งสองข้าง","ໃຊ້ເປັນຄູ່ ຕ້ອງເປັນ 有的 ທັງສອງຂ້າງ"]}
],
3:[
{"t":"把","s":"ประธาน + 把 + กรรม + กริยา + ส่วนขยาย","th":"ดึงกรรมมาไว้หน้ากริยา เน้นว่าจัดการกับสิ่งนั้นจนเกิดผล กริยาต้องมีส่วนขยายท้ายเสมอ ห้ามลอยเดี่ยว","lo":"ດຶງກຳມາໄວ້ໜ້າກະລິຍາ ເນັ້ນວ່າຈັດການກັບສິ່ງນັ້ນຈົນເກີດຜົນ","en":"Fronts the object to stress what was done to it. The verb must carry a complement.","ex":[["我把门关了。","Wǒ bǎ mén guān le.","ฉันปิดประตูแล้ว","ຂ້ອຍປິດປະຕູແລ້ວ","I closed the door."],["请把书放在桌子上。","Qǐng bǎ shū fàng zài zhuōzi shang.","กรุณาวางหนังสือบนโต๊ะ","ກະລຸນາວາງປຶ້ມເທິງໂຕະ","Please put the book on the desk."]],"bad":["我把门关。","我把门关了。","หลังกริยาในประโยค 把 ต้องมีอะไรตามเสมอ","ຫຼັງກະລິຍາໃນປະໂຫຍກ 把 ຕ້ອງມີຫຍັງຕາມສະເໝີ"]},
{"t":"被","s":"ผู้ถูกกระทำ + 被 + ผู้กระทำ + กริยา + ส่วนขยาย","th":"รูปถูกกระทำ ภาษาจีนใช้น้อยกว่าไทยมาก และมักใช้กับเรื่องไม่ดี ผู้กระทำละได้","lo":"ຮູບຖືກກະທຳ ພາສາຈີນໃຊ້ໜ້ອຍກວ່າ ແລະ ມັກໃຊ້ກັບເລື່ອງບໍ່ດີ","en":"Passive. Used far less than in Thai and typically for unwelcome events.","ex":[["我的钱被偷了。","Wǒ de qián bèi tōu le.","เงินฉันถูกขโมยไปแล้ว","ເງິນຂ້ອຍຖືກລັກໄປແລ້ວ","My money was stolen."]],"bad":["这本书被我看。","这本书被我看完了。","被 ต้องมีส่วนขยายท้ายกริยาเหมือน 把","被 ກໍຕ້ອງມີສ່ວນຂະຫຍາຍທ້າຍກະລິຍາ"]},
{"t":"虽然……但是……","s":"虽然 + ข้อเท็จจริง，但是 + สิ่งที่ขัดแย้ง","th":"แม้ว่า…แต่… ใช้คู่กันได้ทั้งสองตัว 虽然 จะวางหน้าหรือหลังประธานก็ได้","lo":"ເຖິງແມ່ນວ່າ…ແຕ່… ໃຊ້ຄູ່ກັນໄດ້ທັງສອງໂຕ","en":"Although…but… Both halves appear together, unlike English.","ex":[["虽然今天很累，但是我还是去上课。","Suīrán jīntiān hěn lèi, dànshì wǒ háishi qù shàngkè.","แม้ว่าวันนี้จะเหนื่อย แต่ฉันก็ยังไปเรียน","ເຖິງແມ່ນວ່າມື້ນີ້ຈະເມື່ອຍ ແຕ່ຂ້ອຍກໍຍັງໄປຮຽນ","Though tired today, I still went to class."]],"bad":["虽然很累。我去上课。","虽然很累，但是我去上课。","ใช้ 虽然 แล้วต้องมีประโยคขัดแย้งตามมา","ໃຊ້ 虽然 ແລ້ວຕ້ອງມີປະໂຫຍກຂັດແຍ້ງຕາມມາ"]},
{"t":"越来越 / 越……越……","s":"越来越 + คุณศัพท์ · 越 A 越 B","th":"越来越 = ยิ่งนานยิ่ง… ส่วน 越 A 越 B = ยิ่ง A ยิ่ง B ทั้งสองแบบห้ามใส่ 很","lo":"越来越 = ຍິ່ງນານຍິ່ງ… ສ່ວນ 越 A 越 B = ຍິ່ງ A ຍິ່ງ B","en":"越来越 = more and more over time. 越 A 越 B = the more A, the more B. Never add 很.","ex":[["天气越来越热了。","Tiānqì yuèláiyuè rè le.","อากาศร้อนขึ้นเรื่อยๆ","ອາກາດຮ້ອນຂຶ້ນເລື້ອຍໆ","The weather is getting hotter."],["越学越有意思。","Yuè xué yuè yǒu yìsi.","ยิ่งเรียนยิ่งสนุก","ຍິ່ງຮຽນຍິ່ງມ່ວນ","The more I study, the more interesting it gets."]],"bad":["天气越来越很热。","天气越来越热。","越来越 ห้ามมี 很","越来越 ຫ້າມມີ 很"]},
{"t":"除了……以外","s":"除了 A 以外，都 / 也 / 还 + …","th":"ถ้าตามด้วย 都 แปลว่า ยกเว้น A ถ้าตามด้วย 也 หรือ 还 แปลว่า นอกจาก A แล้วยังมีอีก ความหมายตรงข้ามกัน ต้องดูคำหลังเสมอ","lo":"ຖ້າຕາມດ້ວຍ 都 ແປວ່າ ຍົກເວັ້ນ A ຖ້າຕາມດ້ວຍ 也 ແປວ່າ ນອກຈາກ A ຍັງມີອີກ","en":"With 都 it means except A. With 也 or 还 it means in addition to A.","ex":[["除了他以外，我们都去。","Chúle tā yǐwài, wǒmen dōu qù.","ยกเว้นเขา พวกเราไปกันหมด","ຍົກເວັ້ນລາວ ພວກເຮົາໄປກັນໝົດ","Everyone but him is going."],["除了中文以外，他还会英文。","Chúle Zhōngwén yǐwài, tā hái huì Yīngwén.","นอกจากภาษาจีน เขายังพูดอังกฤษได้","ນອກຈາກພາສາຈີນ ລາວຍັງເວົ້າອັງກິດໄດ້","Besides Chinese, he also speaks English."]],"bad":["除了他，我们去。","除了他以外，我们都去。","ต้องมี 都 / 也 / 还 ในประโยคหลัง","ຕ້ອງມີ 都/也/还 ໃນປະໂຫຍກຫຼັງ"]},
{"t":"一边……一边……","s":"一边 + กริยา 1 + 一边 + กริยา 2","th":"ทำสองอย่างพร้อมกัน ทั้งสองต้องเป็นกริยาที่ทำพร้อมกันได้จริง และต้องเป็นประธานคนเดียวกัน","lo":"ເຮັດສອງຢ່າງພ້ອມກັນ ປະທານຕ້ອງເປັນຄົນດຽວກັນ","en":"Two simultaneous actions by the same subject.","ex":[["他一边吃饭一边看电视。","Tā yìbiān chīfàn yìbiān kàn diànshì.","เขากินข้าวไปดูทีวีไป","ລາວກິນເຂົ້າໄປເບິ່ງໂທລະພາບໄປ","He eats while watching TV."]],"bad":["我一边高兴一边学习。","我很高兴地学习。","一边 ใช้กับกริยา ไม่ใช้กับคำคุณศัพท์","一边 ໃຊ້ກັບກະລິຍາ ບໍ່ໃຊ້ກັບຄຳຄຸນນາມ"]},
{"t":"如果……就……","s":"如果 + เงื่อนไข，就 + ผลลัพธ์","th":"ถ้า…ก็… ใช้กับเงื่อนไขทั่วไป ประโยคหลังมักมี 就 คู่เสมอ จะใช้ 的话 ต่อท้ายเงื่อนไขแทนก็ได้ เช่น 你去的话","lo":"ຖ້າ…ກໍ… ໃຊ້ກັບເງື່ອນໄຂທົ່ວໄປ ປະໂຫຍກຫຼັງມັກມີ 就 ຄູ່ສະເໝີ","en":"If X, then Y. The second clause normally carries 就. 的话 can replace 如果.","ex":[["如果明天下雨，我就不去了。","Rúguǒ míngtiān xià yǔ, wǒ jiù bú qù le.","ถ้าพรุ่งนี้ฝนตก ฉันก็จะไม่ไป","ຖ້າມື້ອື່ນຝົນຕົກ ຂ້ອຍກໍຈະບໍ່ໄປ","If it rains tomorrow, I won't go."],["你想去的话，我陪你。","Nǐ xiǎng qù dehuà, wǒ péi nǐ.","ถ้าคุณอยากไป ฉันไปเป็นเพื่อน","ຖ້າເຈົ້າຢາກໄປ ຂ້ອຍໄປເປັນເພື່ອນ","If you want to go, I'll come with you."]],"bad":["如果下雨，我不去。","如果下雨，我就不去。","ประโยคผลลัพธ์ควรมี 就 คู่กับ 如果","ປະໂຫຍກຜົນລັບຄວນມີ 就 ຄູ່ກັບ 如果"]},
{"t":"又……又……","s":"又 + คุณศัพท์/กริยา + 又 + คุณศัพท์/กริยา","th":"บอกว่ามีคุณสมบัติสองอย่างพร้อมกัน ทั้งสองต้องเป็นคุณสมบัติแนวเดียวกัน คือดีทั้งคู่หรือแย่ทั้งคู่ ห้ามผสมดีกับแย่","lo":"ບອກວ່າມີຄຸນສົມບັດສອງຢ່າງພ້ອມກັນ ທັງສອງຕ້ອງເປັນແນວດຽວກັນ ດີທັງຄູ່ ຫຼື ຮ້າຍທັງຄູ່","en":"Both A and B at once. The two qualities must point the same way — both positive or both negative.","ex":[["这家店的菜又好吃又便宜。","Zhè jiā diàn de cài yòu hǎochī yòu piányi.","อาหารร้านนี้ทั้งอร่อยทั้งถูก","ອາຫານຮ້ານນີ້ທັງແຊບທັງຖືກ","The food here is both tasty and cheap."],["他又聪明又努力。","Tā yòu cōngming yòu nǔlì.","เขาทั้งฉลาดทั้งขยัน","ລາວທັງສະຫຼາດທັງດຸໝັ່ນ","He is both clever and hardworking."]],"bad":["这个又好吃又贵。","这个虽然好吃，但是很贵。","ดีกับแย่ปนกันต้องใช้ 虽然…但是… ไม่ใช่ 又…又…","ດີກັບຮ້າຍປົນກັນຕ້ອງໃຊ້ 虽然…但是…"]},
{"t":"的 / 地 / 得","s":"คุณศัพท์+的+นาม · คุณศัพท์+地+กริยา · กริยา+得+คุณศัพท์","th":"สามตัวนี้อ่านว่า de เหมือนกันหมด แต่หน้าที่ต่างกัน 的 ขยายคำนาม 地 ขยายกริยาบอกว่าทำอย่างไร 得 ตามหลังกริยาบอกว่าทำได้ดีแค่ไหน","lo":"ສາມໂຕນີ້ອ່ານວ່າ de ຄືກັນ ແຕ່ໜ້າທີ່ຕ່າງກັນ 的 ຂະຫຍາຍຄຳນາມ 地 ຂະຫຍາຍກະລິຍາ 得 ຕາມຫຼັງກະລິຍາ","en":"All read de. 的 modifies nouns, 地 modifies verbs (how), 得 follows verbs (how well).","ex":[["漂亮的花","piàoliang de huā","ดอกไม้ที่สวยงาม","ດອກໄມ້ທີ່ງາມ","beautiful flowers"],["他慢慢地走。","Tā mànmàn de zǒu.","เขาเดินอย่างช้าๆ","ລາວຍ່າງຢ່າງຊ້າໆ","He walks slowly."],["他走得很慢。","Tā zǒu de hěn màn.","เขาเดินได้ช้ามาก","ລາວຍ່າງໄດ້ຊ້າຫຼາຍ","He walks very slowly."]],"bad":["他走的很慢。","他走得很慢。","หลังกริยาบอกระดับต้องใช้ 得","ຫຼັງກະລິຍາບອກລະດັບຕ້ອງໃຊ້ 得"]},
{"t":"先……然后……","s":"先 + กริยา1，然后 + กริยา2","th":"บอกลำดับก่อนหลังของการกระทำ ถ้ามีสามขั้นตอนขึ้นไป ใช้ 先……再……最后…… ได้","lo":"ບອກລຳດັບກ່ອນຫຼັງຂອງການກະທຳ ຖ້າມີສາມຂັ້ນຕອນຂຶ້ນໄປ ໃຊ້ 先……再……最后…… ໄດ້","en":"First… then… For three or more steps use 先…再…最后….","ex":[["我先吃饭，然后去上班。","Wǒ xiān chīfàn, ránhòu qù shàngbān.","ฉันกินข้าวก่อน แล้วค่อยไปทำงาน","ຂ້ອຍກິນເຂົ້າກ່ອນ ແລ້ວຄ່ອຍໄປເຮັດວຽກ","I eat first, then go to work."],["先洗手，再吃饭。","Xiān xǐ shǒu, zài chīfàn.","ล้างมือก่อน ค่อยกินข้าว","ລ້າງມືກ່ອນ ຄ່ອຍກິນເຂົ້າ","Wash your hands first, then eat."]],"bad":["我吃饭先，然后去上班。","我先吃饭，然后去上班。","先 ต้องอยู่หน้ากริยา","先 ຕ້ອງຢູ່ໜ້າກະລິຍາ"]},
{"t":"只有……才……","s":"只有 + เงื่อนไขเดียว，才 + ผล","th":"ต้อง…เท่านั้นถึงจะ… เป็นเงื่อนไขจำเป็นหนึ่งเดียว ต่างจาก 只要……就…… ที่เป็นเงื่อนไขขั้นต่ำแค่นั้นก็พอ","lo":"ຕ້ອງ…ເທົ່ານັ້ນຈຶ່ງຈະ… ເປັນເງື່ອນໄຂຈຳເປັນໜຶ່ງດຽວ ຕ່າງຈາກ 只要……就……","en":"Only if X, then Y — a necessary condition. Contrast 只要…就… (a sufficient minimum).","ex":[["只有努力，才能成功。","Zhǐyǒu nǔlì, cái néng chénggōng.","ต้องขยันเท่านั้นถึงจะสำเร็จ","ຕ້ອງດຸໝັ່ນເທົ່ານັ້ນຈຶ່ງຈະສຳເລັດ","Only through hard work can one succeed."],["只有你才懂我。","Zhǐyǒu nǐ cái dǒng wǒ.","มีแค่คุณเท่านั้นที่เข้าใจฉัน","ມີແຕ່ເຈົ້າເທົ່ານັ້ນທີ່ເຂົ້າໃຈຂ້ອຍ","Only you understand me."]],"bad":["只有努力，就能成功。","只有努力，才能成功。","只有 คู่กับ 才 เท่านั้น ส่วน 只要 คู่กับ 就","只有 ຄູ່ກັບ 才 ສ່ວນ 只要 ຄູ່ກັບ 就"]},
{"t":"对……来说","s":"对 + คน + 来说，…","th":"แปลว่า สำหรับ…แล้ว ใช้ระบุมุมมองว่าเป็นความเห็นของใคร วางไว้ต้นประโยคเสมอ","lo":"ແປວ່າ ສຳລັບ…ແລ້ວ ໃຊ້ລະບຸມຸມມອງວ່າເປັນຄວາມເຫັນຂອງໃຜ ວາງໄວ້ຕົ້ນປະໂຫຍກ","en":"As far as X is concerned — marks whose viewpoint it is. Always sentence-initial.","ex":[["对我来说，健康最重要。","Duì wǒ láishuō, jiànkāng zuì zhòngyào.","สำหรับฉันแล้ว สุขภาพสำคัญที่สุด","ສຳລັບຂ້ອຍແລ້ວ ສຸຂະພາບສຳຄັນທີ່ສຸດ","For me, health matters most."],["对学生来说，这本书很有用。","Duì xuésheng láishuō, zhè běn shū hěn yǒuyòng.","สำหรับนักเรียนแล้ว หนังสือเล่มนี้มีประโยชน์มาก","ສຳລັບນັກຮຽນແລ້ວ ປຶ້ມຫົວນີ້ມີປະໂຫຍດຫຼາຍ","For students, this book is very useful."]],"bad":["健康最重要对我来说。","对我来说，健康最重要。","วลีนี้ต้องอยู่ต้นประโยค","ວະລີນີ້ຕ້ອງຢູ່ຕົ້ນປະໂຫຍກ"]},
{"t":"来 / 去 (趋向补语)","s":"กริยา + 来/去","th":"เติม 来 หรือ 去 หลังกริยาเพื่อบอกทิศทางเทียบกับตัวผู้พูด 来 คือเข้าหาผู้พูด 去 คือออกห่างจากผู้พูด","lo":"ຕື່ມ 来 ຫຼື 去 ຫຼັງກະລິຍາເພື່ອບອກທິດທາງທຽບກັບຜູ້ເວົ້າ 来 ຄືເຂົ້າຫາຜູ້ເວົ້າ 去 ຄືອອກຫ່າງ","en":"来 = movement toward the speaker; 去 = away from the speaker.","ex":[["请进来。","Qǐng jìnlái.","เชิญเข้ามาข้างใน","ເຊີນເຂົ້າມາ","Please come in."],["他上去了。","Tā shàngqù le.","เขาขึ้นไปข้างบนแล้ว","ລາວຂຶ້ນໄປແລ້ວ","He went up."]],"bad":["请进去。(พูดกับแขกที่ยืนอยู่นอกห้องที่เราอยู่)","请进来。","ผู้พูดอยู่ข้างใน จึงต้องใช้ 来","ຜູ້ເວົ້າຢູ່ຂ້າງໃນ ຈຶ່ງຕ້ອງໃຊ້ 来"]},
{"t":"每……都……","s":"每 + ลักษณนาม + นาม + 都 + กริยา","th":"ทุก…ล้วน… เมื่อใช้ 每 ประโยคหลังมักต้องมี 都 คู่เสมอ ยกเว้นกรณีที่ 每 บอกความถี่ เช่น 每天","lo":"ທຸກ…ລ້ວນ… ເມື່ອໃຊ້ 每 ປະໂຫຍກຫຼັງມັກຕ້ອງມີ 都 ຄູ່ສະເໝີ","en":"Every X … all. 每 normally pairs with 都 in the main clause.","ex":[["每个人都有梦想。","Měi ge rén dōu yǒu mèngxiǎng.","ทุกคนล้วนมีความฝัน","ທຸກຄົນລ້ວນມີຄວາມຝັນ","Everyone has a dream."],["我每天都学习中文。","Wǒ měitiān dōu xuéxí Zhōngwén.","ฉันเรียนภาษาจีนทุกวัน","ຂ້ອຍຮຽນພາສາຈີນທຸກມື້","I study Chinese every day."]],"bad":["每个人有梦想。","每个人都有梦想。","每 ควรมี 都 คู่กันในประโยคหลัง","每 ຄວນມີ 都 ຄູ່ກັນໃນປະໂຫຍກຫຼັງ"]},
{"t":"可能补语 (听得懂 / 听不懂)","s":"กริยา + 得/不 + ส่วนขยายผล","th":"บอกว่าทำได้หรือทำไม่ได้ ต่างจาก 能 ตรงที่เน้นความสามารถในสถานการณ์นั้นจริงๆ ตัวปฏิเสธ 听不懂 ใช้บ่อยมากในชีวิตประจำวัน","lo":"ບອກວ່າເຮັດໄດ້ຫຼືເຮັດບໍ່ໄດ້ ຕົວປະຕິເສດ 听不懂 ໃຊ້ເລື້ອຍຫຼາຍໃນຊີວິດປະຈຳວັນ","en":"Says whether an action can succeed. The negative form (听不懂 — can't understand) is everyday vocabulary.","ex":[["我听得懂中文。","Wǒ tīng de dǒng Zhōngwén.","ฉันฟังภาษาจีนเข้าใจ","ຂ້ອຍຟັງພາສາຈີນເຂົ້າໃຈ","I can understand spoken Chinese."],["对不起，我听不懂。","Duìbuqǐ, wǒ tīng bu dǒng.","ขอโทษ ฉันฟังไม่เข้าใจ","ຂໍໂທດ ຂ້ອຍຟັງບໍ່ເຂົ້າໃຈ","Sorry, I don't understand."]],"bad":["我不能听懂。","我听不懂。","สถานการณ์แบบนี้ใช้ 听不懂 เป็นธรรมชาติกว่า","ສະຖານະການແບບນີ້ໃຊ້ 听不懂 ເປັນທຳມະຊາດກວ່າ"]},
{"t":"时量补语 (学了两年)","s":"กริยา + 了 + ระยะเวลา (+ 了)","th":"บอกว่าทำสิ่งนั้นมานานเท่าไหร่ ระยะเวลาต้องอยู่หลังกริยา ถ้ามีกรรมด้วยต้องพูดกริยาซ้ำ หรือวางกรรมไว้ท้ายสุดหลังระยะเวลา","lo":"ບອກວ່າເຮັດສິ່ງນັ້ນມາດົນປານໃດ ໄລຍະເວລາຕ້ອງຢູ່ຫຼັງກະລິຍາ ຖ້າມີກຳຕ້ອງເວົ້າກະລິຍາຊ້ຳ","en":"States how long an action lasted. The duration follows the verb; with an object, repeat the verb.","ex":[["我学了两年中文。","Wǒ xué le liǎng nián Zhōngwén.","ฉันเรียนภาษาจีนมาสองปี","ຂ້ອຍຮຽນພາສາຈີນມາສອງປີ","I studied Chinese for two years."],["他等了我一个小时。","Tā děng le wǒ yí ge xiǎoshí.","เขารอฉันหนึ่งชั่วโมง","ລາວລໍຖ້າຂ້ອຍໜຶ່ງຊົ່ວໂມງ","He waited an hour for me."]],"bad":["我两年学了中文。","我学了两年中文。","ระยะเวลาต้องอยู่หลังกริยา ไม่ใช่หน้า","ໄລຍະເວລາຕ້ອງຢູ່ຫຼັງກະລິຍາ"]},
{"t":"动量补语 (看了三遍)","s":"กริยา + 了 + ตัวเลข + 次/遍/趟","th":"บอกว่าทำกี่ครั้ง 次 คือจำนวนครั้งทั่วไป 遍 คือครั้งที่ทำตั้งแต่ต้นจนจบ 趟 คือเที่ยวการเดินทาง","lo":"ບອກວ່າເຮັດຈັກເທື່ອ 次 ຄືຈຳນວນເທື່ອທົ່ວໄປ 遍 ຄືເທື່ອທີ່ເຮັດແຕ່ຕົ້ນຈົນຈົບ 趟 ຄືຖ້ຽວການເດີນທາງ","en":"How many times. 次 = generic times, 遍 = from start to finish, 趟 = trips.","ex":[["这本书我看了三遍。","Zhè běn shū wǒ kàn le sān biàn.","หนังสือเล่มนี้ฉันอ่านสามรอบแล้ว","ປຶ້ມຫົວນີ້ຂ້ອຍອ່ານສາມຮອບແລ້ວ","I've read this book three times."],["我去过两次中国。","Wǒ qù guo liǎng cì Zhōngguó.","ฉันเคยไปจีนสองครั้ง","ຂ້ອຍເຄີຍໄປຈີນສອງເທື່ອ","I've been to China twice."]],"bad":["我三遍看了这本书。","这本书我看了三遍。","จำนวนครั้งต้องอยู่หลังกริยา","ຈຳນວນເທື່ອຕ້ອງຢູ່ຫຼັງກະລິຍາ"]},
{"t":"跟……一样","s":"A + 跟 + B + 一样 (+ คุณศัพท์)","th":"ใช้บอกว่าเหมือนกัน ต่างจาก 比 ที่ใช้เปรียบเทียบว่าใครมากกว่า ปฏิเสธคือ 跟……不一样","lo":"ໃຊ້ບອກວ່າຄືກັນ ຕ່າງຈາກ 比 ທີ່ໃຊ້ປຽບທຽບວ່າໃຜຫຼາຍກວ່າ ປະຕິເສດຄື 跟……不一样","en":"Says two things are the same, unlike 比 which ranks them. Negative: 跟…不一样.","ex":[["我的手机跟你的一样。","Wǒ de shǒujī gēn nǐ de yíyàng.","มือถือฉันเหมือนของคุณเลย","ໂທລະສັບຂ້ອຍຄືກັນກັບຂອງເຈົ້າ","My phone is the same as yours."],["他跟我一样高。","Tā gēn wǒ yíyàng gāo.","เขาสูงเท่ากับฉัน","ລາວສູງເທົ່າກັບຂ້ອຍ","He's as tall as me."]],"bad":["他跟我一样不高。","他跟我不一样高。","ปฏิเสธต้องใส่ 不 ไว้หน้า 一样","ປະຕິເສດຕ້ອງໃສ່ 不 ໄວ້ໜ້າ 一样"]},
{"t":"没有……(那么)……","s":"A + 没有 + B + (那么/这么) + คุณศัพท์","th":"เป็นรูปปฏิเสธของการเปรียบเทียบ แปลว่า A ไม่เท่า B ใช้แทนการพูดว่า 不比 ซึ่งคนจีนแทบไม่ใช้","lo":"ເປັນຮູບປະຕິເສດຂອງການປຽບທຽບ ແປວ່າ A ບໍ່ເທົ່າ B","en":"The negative comparison: A is not as … as B. Far more natural than 不比.","ex":[["今天没有昨天热。","Jīntiān méiyǒu zuótiān rè.","วันนี้ไม่ร้อนเท่าเมื่อวาน","ມື້ນີ້ບໍ່ຮ້ອນເທົ່າມື້ວານ","Today isn't as hot as yesterday."],["我没有他那么努力。","Wǒ méiyǒu tā nàme nǔlì.","ฉันไม่ขยันเท่าเขา","ຂ້ອຍບໍ່ດຸໝັ່ນເທົ່າລາວ","I'm not as hardworking as him."]],"bad":["今天不比昨天热。","今天没有昨天热。","ปฏิเสธการเปรียบเทียบใช้ 没有 เป็นธรรมชาติกว่า","ປະຕິເສດການປຽບທຽບໃຊ້ 没有 ເປັນທຳມະຊາດກວ່າ"]},
{"t":"让 / 叫 (ประโยคใช้ให้ทำ)","s":"A + 让/叫 + B + กริยา","th":"ใช้บอกว่าใครให้ใครทำอะไร 让 นุ่มนวลกว่า แปลว่า ให้ / ปล่อยให้ ส่วน 叫 หนักแน่นกว่า ออกแนวสั่ง","lo":"ໃຊ້ບອກວ່າໃຜໃຫ້ໃຜເຮັດຫຍັງ 让 ນຸ້ມນວນກວ່າ ສ່ວນ 叫 ໜັກແໜ້ນກວ່າ ອອກແນວສັ່ງ","en":"A makes/lets B do something. 让 is softer (let), 叫 is firmer (tell to).","ex":[["妈妈让我早点儿回家。","Māma ràng wǒ zǎodiǎnr huí jiā.","แม่ให้ฉันกลับบ้านเร็วหน่อย","ແມ່ໃຫ້ຂ້ອຍກັບບ້ານໄວໜ້ອຍ","Mum told me to come home early."],["对不起，让你久等了。","Duìbuqǐ, ràng nǐ jiǔ děng le.","ขอโทษที่ให้รอนาน","ຂໍໂທດທີ່ໃຫ້ລໍຖ້າດົນ","Sorry to keep you waiting."]],"bad":["妈妈让我不回家晚。","妈妈不让我回家太晚。","คำปฏิเสธต้องวางไว้หน้า 让","ຄຳປະຕິເສດຕ້ອງວາງໄວ້ໜ້າ 让"]},
{"t":"一……也/都不……","s":"一 + ลักษณนาม + นาม + 也/都 + 不/没 + กริยา","th":"ใช้ปฏิเสธแบบเน้นย้ำว่าไม่มีเลยแม้แต่นิดเดียว ต้องมี 也 หรือ 都 คั่นเสมอ","lo":"ໃຊ້ປະຕິເສດແບບເນັ້ນຢ້ຳວ່າບໍ່ມີເລີຍແມ້ແຕ່ໜ້ອຍ ຕ້ອງມີ 也 ຫຼື 都 ຄັ່ນສະເໝີ","en":"Emphatic negation: not even one. 也 or 都 is required.","ex":[["我一点儿也不累。","Wǒ yìdiǎnr yě bú lèi.","ฉันไม่เหนื่อยเลยสักนิด","ຂ້ອຍບໍ່ເມື່ອຍເລີຍ","I'm not tired at all."],["他一个字都没写。","Tā yí ge zì dōu méi xiě.","เขาไม่ได้เขียนสักตัวเดียว","ລາວບໍ່ໄດ້ຂຽນຈັກໂຕ","He didn't write a single word."]],"bad":["我一点儿不累。","我一点儿也不累。","ต้องมี 也 หรือ 都 คั่นเสมอ","ຕ້ອງມີ 也 ຫຼື 都 ຄັ່ນສະເໝີ"]}
],
4:[
{"t":"不但……而且……","s":"不但 A，而且 B","th":"ไม่เพียงแต่ A แต่ยัง B ถ้าประธานเดียวกัน 不但 อยู่หลังประธาน ถ้าคนละประธาน 不但 อยู่หน้าประธาน","lo":"ບໍ່ພຽງແຕ່ A ແຕ່ຍັງ B ອີກ","en":"Not only A but also B. Same subject → 不但 after the subject; different subjects → before it.","ex":[["他不但会说中文，而且说得很好。","Tā búdàn huì shuō Zhōngwén, érqiě shuō de hěn hǎo.","เขาไม่เพียงพูดจีนได้ แต่ยังพูดได้ดีมาก","ລາວບໍ່ພຽງເວົ້າຈີນໄດ້ ແຕ່ຍັງເວົ້າໄດ້ດີຫຼາຍ","He not only speaks Chinese, he speaks it well."]],"bad":["不但他会说中文，而且他说得很好。","他不但会说中文，而且说得很好。","ประธานเดียวกัน 不但 ต้องอยู่หลังประธาน","ປະທານດຽວກັນ 不但 ຕ້ອງຢູ່ຫຼັງປະທານ"]},
{"t":"是……的","s":"是 + เวลา / สถานที่ / วิธี + 的","th":"ใช้เน้นรายละเอียดของเหตุการณ์ที่เกิดขึ้นแล้ว ว่าเกิดเมื่อไหร่ ที่ไหน หรืออย่างไร ไม่ได้ถามว่าเกิดหรือไม่","lo":"ໃຊ້ເນັ້ນລາຍລະອຽດຂອງເຫດການທີ່ເກີດຂຶ້ນແລ້ວ","en":"Highlights when, where or how a past event happened — not whether it happened.","ex":[["我是昨天来的。","Wǒ shì zuótiān lái de.","ฉันมาเมื่อวานนี้","ຂ້ອຍມາມື້ວານນີ້","It was yesterday that I came."],["你是怎么来的？","Nǐ shì zěnme lái de?","คุณมายังไง","ເຈົ້າມາແນວໃດ?","How did you get here?"]],"bad":["我是昨天来了。","我是昨天来的。","โครงสร้างนี้ลงท้ายด้วย 的 ไม่ใช่ 了","ໂຄງສ້າງນີ້ລົງທ້າຍດ້ວຍ 的"]},
{"t":"无论……都……","s":"无论 + คำถาม / ตัวเลือก，都 + ผลลัพธ์","th":"ไม่ว่าจะ…ก็… หลัง 无论 ต้องมีคำถาม (什么/谁/怎么) หรือตัวเลือก A还是B ห้ามเป็นข้อความธรรมดา","lo":"ບໍ່ວ່າຈະ…ກໍ… ຫຼັງ 无论 ຕ້ອງມີຄຳຖາມ ຫຼື ຕົວເລືອກ","en":"No matter… still… 无论 must be followed by a question word or an A-or-B choice.","ex":[["无论多难，我都要学下去。","Wúlùn duō nán, wǒ dōu yào xué xiàqù.","ไม่ว่าจะยากแค่ไหน ฉันก็จะเรียนต่อไป","ບໍ່ວ່າຈະຍາກປານໃດ ຂ້ອຍກໍຈະຮຽນຕໍ່ໄປ","However hard it is, I'll keep studying."]],"bad":["无论很难，我都学。","无论多难，我都学。","หลัง 无论 ต้องเป็นคำถามหรือตัวเลือก","ຫຼັງ 无论 ຕ້ອງເປັນຄຳຖາມ ຫຼື ຕົວເລືອກ"]},
{"t":"只要……就……","s":"只要 + เงื่อนไข，就 + ผล","th":"ขอเพียงแค่…ก็… เป็นเงื่อนไขขั้นต่ำ ต่างจาก 只有……才…… ที่แปลว่า ต้อง…เท่านั้นถึงจะ…","lo":"ຂໍພຽງແຕ່…ກໍ… ເປັນເງື່ອນໄຂຂັ້ນຕ່ຳ","en":"As long as X, then Y — a minimum condition. Contrast with 只有…才… (only if).","ex":[["只要努力，就会有进步。","Zhǐyào nǔlì, jiù huì yǒu jìnbù.","ขอแค่ขยัน ก็จะมีความก้าวหน้า","ຂໍພຽງແຕ່ພະຍາຍາມ ກໍຈະມີຄວາມກ້າວໜ້າ","As long as you work hard, you'll improve."]],"bad":["只要努力，才会有进步。","只要努力，就会有进步。","只要 คู่กับ 就 ส่วน 只有 คู่กับ 才","只要 ຄູ່ກັບ 就 ສ່ວນ 只有 ຄູ່ກັບ 才"]},
{"t":"连……也 / 都……","s":"连 + สิ่งที่คาดไม่ถึง + 也 / 都 + …","th":"แม้แต่…ก็… ใช้เน้นกรณีสุดขั้ว สิ่งที่วางหลัง 连 ต้องเป็นสิ่งที่ปกติน่าจะเป็นจริงที่สุด","lo":"ແມ້ແຕ່…ກໍ… ໃຊ້ເນັ້ນກໍລະນີສຸດຂົ້ວ","en":"Even X does or doesn't — emphasises the most extreme case.","ex":[["他连自己的名字都不会写。","Tā lián zìjǐ de míngzi dōu bú huì xiě.","เขาแม้แต่ชื่อตัวเองยังเขียนไม่เป็น","ລາວແມ້ແຕ່ຊື່ໂຕເອງຍັງຂຽນບໍ່ເປັນ","He can't even write his own name."]],"bad":["他连自己的名字不会写。","他连自己的名字都不会写。","连 ต้องมี 也 หรือ 都 ตามเสมอ","连 ຕ້ອງມີ 也 ຫຼື 都 ຕາມສະເໝີ"]},
{"t":"结果补语","s":"กริยา + 完 / 好 / 到 / 见 / 懂","th":"ส่วนขยายผลลัพธ์ บอกว่ากริยานั้นสำเร็จผลอย่างไร ปฏิเสธใช้ 没 ไม่ใช่ 不","lo":"ສ່ວນຂະຫຍາຍຜົນລັບ ບອກວ່າກະລິຍານັ້ນສຳເລັດຜົນແນວໃດ","en":"Resultative complements state the outcome of a verb. Negate with 没, not 不.","ex":[["我听懂了。","Wǒ tīng dǒng le.","ฉันฟังเข้าใจแล้ว","ຂ້ອຍຟັງເຂົ້າໃຈແລ້ວ","I understood it."],["我没看完。","Wǒ méi kàn wán.","ฉันดูยังไม่จบ","ຂ້ອຍເບິ່ງຍັງບໍ່ຈົບ","I haven't finished watching."]],"bad":["我不看完。","我没看完。","ผลลัพธ์ที่ยังไม่เกิด ใช้ 没","ຜົນລັບທີ່ຍັງບໍ່ເກີດ ໃຊ້ 没"]},
{"t":"使","s":"สิ่ง/เหตุ + 使 + คน + คุณศัพท์/กริยา","th":"แปลว่า ทำให้ ใช้ในภาษาเขียนและภาษาทางการ ประธานมักเป็นสิ่งของหรือเหตุการณ์ ไม่ใช่คน ต่างจาก 让 ที่ใช้กับคนสั่งคน","lo":"ແປວ່າ ເຮັດໃຫ້ ໃຊ້ໃນພາສາຂຽນ ປະທານມັກເປັນສິ່ງຂອງຫຼືເຫດການ ບໍ່ແມ່ນຄົນ","en":"To make/cause — formal and written. The subject is usually a thing or event, not a person.","ex":[["这个消息使大家很高兴。","Zhège xiāoxi shǐ dàjiā hěn gāoxìng.","ข่าวนี้ทำให้ทุกคนดีใจมาก","ຂ່າວນີ້ເຮັດໃຫ້ທຸກຄົນດີໃຈຫຼາຍ","This news made everyone happy."],["运动使人健康。","Yùndòng shǐ rén jiànkāng.","การออกกำลังกายทำให้คนแข็งแรง","ການອອກກຳລັງກາຍເຮັດໃຫ້ຄົນແຂງແຮງ","Exercise keeps people healthy."]],"bad":["妈妈使我回家。","妈妈让我回家。","คนสั่งคนใช้ 让 ส่วน 使 ใช้กับเหตุการณ์","ຄົນສັ່ງຄົນໃຊ້ 让 ສ່ວນ 使 ໃຊ້ກັບເຫດການ"]},
{"t":"关于 / 对于","s":"关于 + หัวข้อ，… · 对于 + เป้าหมาย，…","th":"关于 แปลว่า เกี่ยวกับ ใช้ระบุหัวข้อเรื่อง ส่วน 对于 แปลว่า ต่อ / ที่มีต่อ ใช้ระบุเป้าหมายของทัศนคติหรือการกระทำ","lo":"关于 ແປວ່າ ກ່ຽວກັບ ໃຊ້ລະບຸຫົວຂໍ້ ສ່ວນ 对于 ແປວ່າ ຕໍ່ ໃຊ້ລະບຸເປົ້າໝາຍຂອງທັດສະນະ","en":"关于 introduces a topic (about); 对于 introduces the target of an attitude (toward).","ex":[["关于这个问题，我们再讨论。","Guānyú zhège wèntí, wǒmen zài tǎolùn.","เกี่ยวกับปัญหานี้ เราค่อยคุยกันอีกที","ກ່ຽວກັບບັນຫານີ້ ພວກເຮົາຄ່ອຍລົມກັນອີກ","As for this issue, let's discuss it later."],["对于这件事，我没有意见。","Duìyú zhè jiàn shì, wǒ méiyǒu yìjiàn.","ต่อเรื่องนี้ ฉันไม่มีความเห็น","ຕໍ່ເລື່ອງນີ້ ຂ້ອຍບໍ່ມີຄວາມເຫັນ","On this matter, I have no opinion."]],"bad":["我们讨论关于这个问题。","关于这个问题，我们讨论一下。","关于 มักวางต้นประโยค ไม่วางหลังกริยา","关于 ມັກວາງຕົ້ນປະໂຫຍກ"]},
{"t":"按照 / 根据","s":"按照/根据 + หลักเกณฑ์，…","th":"按照 เน้นทำตามกฎระเบียบที่กำหนดไว้ ส่วน 根据 เน้นอ้างอิงจากข้อมูลหรือหลักฐาน ทั้งคู่วางไว้ต้นประโยค","lo":"按照 ເນັ້ນເຮັດຕາມກົດລະບຽບ ສ່ວນ 根据 ເນັ້ນອ້າງອີງຈາກຂໍ້ມູນຫຼືຫຼັກຖານ","en":"按照 = in accordance with (rules); 根据 = based on (evidence, data).","ex":[["请按照规定办理。","Qǐng ànzhào guīdìng bànlǐ.","กรุณาดำเนินการตามระเบียบ","ກະລຸນາດຳເນີນການຕາມລະບຽບ","Please proceed according to the rules."],["根据调查，八成人同意。","Gēnjù diàochá, bā chéng rén tóngyì.","จากผลสำรวจ 80% เห็นด้วย","ຈາກຜົນສຳຫຼວດ 80% ເຫັນດີ","According to the survey, 80% agree."]],"bad":["我办理按照规定。","我按照规定办理。","วลีนี้ต้องมาก่อนกริยา","ວະລີນີ້ຕ້ອງມາກ່ອນກະລິຍາ"]},
{"t":"不是……而是……","s":"不是 + A，而是 + B","th":"ใช้แก้ความเข้าใจผิด บอกว่าไม่ใช่ A แต่เป็น B ต่างจาก 不但……而且…… ที่เป็นการเพิ่มเติม","lo":"ໃຊ້ແກ້ຄວາມເຂົ້າໃຈຜິດ ບອກວ່າບໍ່ແມ່ນ A ແຕ່ແມ່ນ B","en":"Not A, but B — used to correct a misunderstanding.","ex":[["他不是老师，而是医生。","Tā bú shì lǎoshī, érshì yīshēng.","เขาไม่ใช่ครู แต่เป็นหมอ","ລາວບໍ່ແມ່ນຄູ ແຕ່ແມ່ນໝໍ","He isn't a teacher but a doctor."],["问题不是钱，而是时间。","Wèntí bú shì qián, érshì shíjiān.","ปัญหาไม่ใช่เงิน แต่เป็นเวลา","ບັນຫາບໍ່ແມ່ນເງິນ ແຕ່ແມ່ນເວລາ","The problem isn't money but time."]],"bad":["他不是老师，但是医生。","他不是老师，而是医生。","แก้ความเข้าใจผิดใช้ 而是 ไม่ใช่ 但是","ແກ້ຄວາມເຂົ້າໃຈຜິດໃຊ້ 而是"]},
{"t":"既……又……","s":"既 + A + 又 + B","th":"คล้าย 又……又…… แต่เป็นทางการกว่า ใช้ในภาษาเขียนได้ดี ทั้งสองฝั่งต้องเป็นคุณสมบัติแนวเดียวกัน","lo":"ຄ້າຍ 又……又…… ແຕ່ເປັນທາງການກວ່າ ທັງສອງຝັ່ງຕ້ອງເປັນຄຸນສົມບັດແນວດຽວກັນ","en":"Both A and B — a more formal version of 又…又….","ex":[["这样既省钱又省时间。","Zhèyàng jì shěng qián yòu shěng shíjiān.","แบบนี้ทั้งประหยัดเงินทั้งประหยัดเวลา","ແບບນີ້ທັງປະຢັດເງິນທັງປະຢັດເວລາ","This saves both money and time."]],"bad":["这样既省钱也省时间。","这样既省钱又省时间。","既 ต้องคู่กับ 又 ไม่ใช่ 也","既 ຕ້ອງຄູ່ກັບ 又 ບໍ່ແມ່ນ 也"]},
{"t":"到底 / 究竟","s":"到底/究竟 + คำถาม","th":"ใช้เน้นความอยากรู้ในประโยคคำถาม แปลประมาณว่า ตกลงแล้ว…กันแน่ ห้ามใช้กับคำถามที่ลงท้ายด้วย 吗","lo":"ໃຊ້ເນັ້ນຄວາມຢາກຮູ້ໃນປະໂຫຍກຄຳຖາມ ຫ້າມໃຊ້ກັບຄຳຖາມທີ່ລົງທ້າຍດ້ວຍ 吗","en":"Adds urgency to a question — what on earth…? Never use with a 吗 question.","ex":[["你到底想说什么？","Nǐ dàodǐ xiǎng shuō shénme?","ตกลงคุณอยากพูดอะไรกันแน่","ຕົກລົງເຈົ້າຢາກເວົ້າຫຍັງແທ້?","What on earth are you trying to say?"],["他究竟去不去？","Tā jiūjìng qù bu qù?","ตกลงเขาจะไปหรือไม่ไปกันแน่","ຕົກລົງລາວຈະໄປຫຼືບໍ່?","Is he going or not?"]],"bad":["你到底想去吗？","你到底想不想去？","到底 ใช้กับ 吗 ไม่ได้ ต้องเปลี่ยนเป็นรูป 想不想","到底 ໃຊ້ກັບ 吗 ບໍ່ໄດ້"]},
{"t":"好像……一样","s":"好像 + … + 一样/似的","th":"ใช้เปรียบเปรยว่าเหมือนกับ… หรือใช้เดาว่าดูเหมือนว่า… เป็นโครงสร้างที่เจอบ่อยมากในบทอ่าน","lo":"ໃຊ້ປຽບທຽບວ່າຄືກັບ… ຫຼືໃຊ້ເດົາວ່າເບິ່ງຄືວ່າ…","en":"Like / as if — very common in reading passages.","ex":[["他好像很累一样。","Tā hǎoxiàng hěn lèi yíyàng.","เขาดูเหมือนเหนื่อยมาก","ລາວເບິ່ງຄືເມື່ອຍຫຼາຍ","He looks really tired."],["时间过得好像飞一样。","Shíjiān guò de hǎoxiàng fēi yíyàng.","เวลาผ่านไปราวกับบินได้","ເວລາຜ່ານໄປຄືກັບບິນ","Time flies."]],"bad":["他好像很累。一样","他好像很累一样。","一样 ต้องปิดท้ายประโยคติดกัน","一样 ຕ້ອງປິດທ້າຍປະໂຫຍກຕິດກັນ"]},
{"t":"疑问代词表任指 (什么都 / 谁都)","s":"什么/谁/哪儿 + 都/也 + …","th":"เอาคำถามมาใช้ในความหมายว่า ทุกอย่าง ทุกคน ที่ไหนก็ตาม ไม่ได้ใช้ถาม ต้องมี 都 หรือ 也 ตามหลังเสมอ","lo":"ເອົາຄຳຖາມມາໃຊ້ໃນຄວາມໝາຍວ່າ ທຸກຢ່າງ ທຸກຄົນ ບໍ່ໄດ້ໃຊ້ຖາມ ຕ້ອງມີ 都 ຫຼື 也 ຕາມຫຼັງ","en":"Question words used to mean anything / everyone / anywhere. 都 or 也 must follow.","ex":[["我什么都不想吃。","Wǒ shénme dōu bù xiǎng chī.","ฉันไม่อยากกินอะไรเลย","ຂ້ອຍບໍ່ຢາກກິນຫຍັງເລີຍ","I don't want to eat anything."],["这件事谁都知道。","Zhè jiàn shì shéi dōu zhīdào.","เรื่องนี้ใครๆ ก็รู้","ເລື່ອງນີ້ໃຜກໍຮູ້","Everyone knows about this."]],"bad":["我什么不想吃。","我什么都不想吃。","ต้องมี 都 หรือ 也 ตามหลังเสมอ","ຕ້ອງມີ 都 ຫຼື 也 ຕາມຫຼັງສະເໝີ"]}
],
5:[
{"t":"即使……也……","s":"即使 + สมมติ，也 + ผลที่ไม่เปลี่ยน","th":"ถึงแม้ว่า…ก็ยัง… ใช้กับเรื่องสมมติที่ยังไม่เกิด ต่างจาก 虽然 ที่ใช้กับข้อเท็จจริงที่เกิดแล้ว","lo":"ເຖິງແມ່ນວ່າ…ກໍຍັງ… ໃຊ້ກັບເລື່ອງສົມມຸດ","en":"Even if — hypothetical, unlike 虽然 which states an actual fact.","ex":[["即使下雨，我也要去。","Jíshǐ xià yǔ, wǒ yě yào qù.","ถึงฝนจะตก ฉันก็จะไป","ເຖິງຝົນຈະຕົກ ຂ້ອຍກໍຈະໄປ","Even if it rains, I'm going."]],"bad":["即使下雨了，我也要去。","即使下雨，我也要去。","เรื่องสมมติยังไม่เกิด ไม่ใส่ 了","ເລື່ອງສົມມຸດຍັງບໍ່ເກີດ ບໍ່ໃສ່ 了"]},
{"t":"与其……不如……","s":"与其 A，不如 B","th":"แทนที่จะ A สู้ B ดีกว่า ผู้พูดเลือก B เสมอ ลำดับห้ามสลับ","lo":"ແທນທີ່ຈະ A ສູ້ B ດີກວ່າ ຜູ້ເວົ້າເລືອກ B ສະເໝີ","en":"Rather than A, better to B. The speaker always prefers B; order is fixed.","ex":[["与其等着，不如现在就开始。","Yǔqí děng zhe, bùrú xiànzài jiù kāishǐ.","แทนที่จะรอ เริ่มตอนนี้เลยดีกว่า","ແທນທີ່ຈະລໍຖ້າ ເລີ່ມດຽວນີ້ເລີຍດີກວ່າ","Rather than wait, better to start now."]],"bad":["不如现在开始，与其等着。","与其等着，不如现在开始。","与其 ต้องมาก่อน 不如 เสมอ","与其 ຕ້ອງມາກ່ອນ 不如 ສະເໝີ"]},
{"t":"宁可……也不……","s":"宁可 A，也不 B","th":"ยอม A ดีกว่าจะ B แสดงการเลือกที่หนักแน่นเมื่อทั้งสองทางไม่ดี ผู้พูดเลือก A","lo":"ຍອມ A ດີກວ່າຈະ B ຜູ້ເວົ້າເລືອກ A","en":"Would rather A than B — a firm choice between two unwelcome options.","ex":[["我宁可走路，也不坐他的车。","Wǒ nìngkě zǒulù, yě bù zuò tā de chē.","ฉันยอมเดินดีกว่านั่งรถเขา","ຂ້ອຍຍອມຍ່າງດີກວ່ານັ່ງລົດລາວ","I'd rather walk than ride with him."]],"bad":["我宁可走路，不如坐车。","我宁可走路，也不坐车。","宁可 คู่กับ 也不 ไม่ใช่ 不如","宁可 ຄູ່ກັບ 也不"]},
{"t":"一……就……","s":"一 + กริยา 1，就 + กริยา 2","th":"พอ…ก็…ทันที ใช้ได้ทั้งเหตุการณ์ที่ตามกันติดๆ และนิสัยที่เกิดซ้ำๆ","lo":"ພໍ…ກໍ…ທັນທີ","en":"As soon as X, then Y. Covers both immediate sequence and habitual patterns.","ex":[["他一回家就睡觉。","Tā yì huí jiā jiù shuìjiào.","พอเขากลับถึงบ้านก็นอนเลย","ພໍລາວກັບຮອດບ້ານກໍນອນເລີຍ","He goes to sleep as soon as he gets home."]],"bad":["他一回家，然后睡觉。","他一回家就睡觉。","一 ต้องคู่กับ 就","一 ຕ້ອງຄູ່ກັບ 就"]},
{"t":"不管……都……","s":"不管 + คำถาม / ตัวเลือก，都 + ผล","th":"ความหมายเหมือน 无论 แต่ 不管 เป็นภาษาพูด ส่วน 无论 เป็นทางการ ใช้ในงานเขียน","lo":"ຄວາມໝາຍຄື 无论 ແຕ່ 不管 ເປັນພາສາເວົ້າ","en":"Same meaning as 无论 but colloquial; 无论 is the formal, written choice.","ex":[["不管你说什么，我都不同意。","Bùguǎn nǐ shuō shénme, wǒ dōu bù tóngyì.","ไม่ว่าคุณจะพูดอะไร ฉันก็ไม่เห็นด้วย","ບໍ່ວ່າເຈົ້າຈະເວົ້າຫຍັງ ຂ້ອຍກໍບໍ່ເຫັນດີ","No matter what you say, I disagree."]],"bad":["不管你说这个，我都不同意。","不管你说什么，我都不同意。","หลัง 不管 ต้องเป็นคำถามหรือตัวเลือก","ຫຼັງ 不管 ຕ້ອງເປັນຄຳຖາມ"]},
{"t":"之所以……是因为……","s":"A 之所以 B，是因为 C","th":"กลับลำดับการบอกเหตุผล คือพูดผลก่อนแล้วค่อยเฉลยสาเหตุ ใช้เพื่อเน้นสาเหตุ พบบ่อยในบทความและการเขียนเชิงวิเคราะห์","lo":"ກັບລຳດັບການບອກເຫດຜົນ ຄືເວົ້າຜົນກ່ອນແລ້ວຄ່ອຍເສລີຍສາເຫດ ໃຊ້ເພື່ອເນັ້ນສາເຫດ","en":"States the result first, then reveals the cause — used to stress the reason. Common in written analysis.","ex":[["他之所以成功，是因为他很努力。","Tā zhīsuǒyǐ chénggōng, shì yīnwèi tā hěn nǔlì.","ที่เขาสำเร็จได้ก็เพราะเขาขยันมาก","ທີ່ລາວສຳເລັດໄດ້ກໍຍ້ອນລາວດຸໝັ່ນຫຼາຍ","The reason he succeeded is that he worked hard."]],"bad":["因为他很努力，之所以成功。","他之所以成功，是因为他很努力。","之所以 ต้องมาก่อน แล้วตามด้วย 是因为","之所以 ຕ້ອງມາກ່ອນ ແລ້ວຕາມດ້ວຍ 是因为"]},
{"t":"一方面……另一方面……","s":"一方面 + A，另一方面 + B","th":"ใช้แจกแจงสองแง่มุมของเรื่องเดียวกัน จะเป็นสองด้านที่เสริมกันหรือขัดกันก็ได้ ใช้บ่อยมากในการเขียนเรียงความ","lo":"ໃຊ້ແຈກແຈງສອງແງ່ມຸມຂອງເລື່ອງດຽວກັນ ໃຊ້ເລື້ອຍໃນການຂຽນຮຽງຄວາມ","en":"On the one hand… on the other hand… A staple of essay writing.","ex":[["一方面要工作，另一方面要照顾家人。","Yì fāngmiàn yào gōngzuò, lìng yì fāngmiàn yào zhàogù jiārén.","ด้านหนึ่งต้องทำงาน อีกด้านก็ต้องดูแลครอบครัว","ດ້ານໜຶ່ງຕ້ອງເຮັດວຽກ ອີກດ້ານກໍຕ້ອງເບິ່ງແຍງຄອບຄົວ","On one hand I must work, on the other I must care for my family."]],"bad":["一方面要工作，一方面要照顾家人。","一方面要工作，另一方面要照顾家人。","ฝั่งที่สองต้องเป็น 另一方面","ຝັ່ງທີສອງຕ້ອງເປັນ 另一方面"]},
{"t":"除非……否则……","s":"除非 + เงื่อนไขเดียว，否则 + ผลที่จะเกิด","th":"เว้นเสียแต่ว่า…ไม่อย่างนั้นแล้ว… เป็นเงื่อนไขเดียวที่จะเปลี่ยนผลลัพธ์ได้ จะใช้ 不然 แทน 否则 ก็ได้","lo":"ເວັ້ນເສຍແຕ່ວ່າ…ຖ້າບໍ່ດັ່ງນັ້ນ… ເປັນເງື່ອນໄຂດຽວທີ່ຈະປ່ຽນຜົນລັບໄດ້","en":"Unless X, otherwise Y — the single condition that changes the outcome.","ex":[["除非你道歉，否则我不原谅你。","Chúfēi nǐ dàoqiàn, fǒuzé wǒ bù yuánliàng nǐ.","เว้นแต่คุณจะขอโทษ ไม่อย่างนั้นฉันไม่ยกโทษให้","ເວັ້ນເສຍແຕ່ເຈົ້າຈະຂໍໂທດ ບໍ່ດັ່ງນັ້ນຂ້ອຍບໍ່ໃຫ້ອະໄພ","Unless you apologise, I won't forgive you."]],"bad":["除非你道歉，就我原谅你。","除非你道歉，否则我不原谅你。","除非 คู่กับ 否则 หรือ 不然","除非 ຄູ່ກັບ 否则 ຫຼື 不然"]},
{"t":"随着……","s":"随着 + การเปลี่ยนแปลง，ผลที่ตามมา","th":"แปลว่า เมื่อ…เปลี่ยนไป สิ่งนี้ก็เปลี่ยนตาม ใช้บรรยายแนวโน้มที่เปลี่ยนไปพร้อมกัน พบบ่อยมากในข่าวและบทความ","lo":"ແປວ່າ ເມື່ອ…ປ່ຽນໄປ ສິ່ງນີ້ກໍປ່ຽນຕາມ ພົບເລື້ອຍໃນຂ່າວແລະບົດຄວາມ","en":"As X changes, Y follows. Extremely common in news and articles.","ex":[["随着科技的发展，生活越来越方便。","Suízhe kējì de fāzhǎn, shēnghuó yuèláiyuè fāngbiàn.","เมื่อเทคโนโลยีพัฒนาขึ้น ชีวิตก็สะดวกขึ้นเรื่อยๆ","ເມື່ອເຕັກໂນໂລຊີພັດທະນາຂຶ້ນ ຊີວິດກໍສະດວກຂຶ້ນເລື້ອຍໆ","As technology develops, life becomes more convenient."]],"bad":["随着科技发展了，生活方便。","随着科技的发展，生活越来越方便。","หลัง 随着 มักเป็นวลีนาม ไม่ใช่ประโยคเต็มที่มี 了","ຫຼັງ 随着 ມັກເປັນວະລີນາມ"]},
{"t":"再……也……","s":"再 + คุณศัพท์/กริยา + 也 + ผลที่ไม่เปลี่ยน","th":"ต่อให้…แค่ไหนก็ยัง… ใช้เน้นว่าไม่ว่าจะระดับไหนผลก็ไม่เปลี่ยน ต่างจาก 再 ที่แปลว่าอีกครั้ง","lo":"ຕໍ່ໃຫ້…ປານໃດກໍຍັງ… ໃຊ້ເນັ້ນວ່າບໍ່ວ່າຈະລະດັບໃດຜົນກໍບໍ່ປ່ຽນ","en":"No matter how X, still Y — a different 再 from the one meaning again.","ex":[["再忙也要吃饭。","Zài máng yě yào chīfàn.","ต่อให้ยุ่งแค่ไหนก็ต้องกินข้าว","ຕໍ່ໃຫ້ຫຍຸ້ງປານໃດກໍຕ້ອງກິນເຂົ້າ","No matter how busy, you must eat."],["再难我也不放弃。","Zài nán wǒ yě bú fàngqì.","ต่อให้ยากแค่ไหนฉันก็ไม่ยอมแพ้","ຕໍ່ໃຫ້ຍາກປານໃດຂ້ອຍກໍບໍ່ຍອມແພ້","However hard it is, I won't give up."]],"bad":["再忙都要吃饭。","再忙也要吃饭。","โครงสร้างนี้คู่กับ 也 เป็นหลัก","ໂຄງສ້າງນີ້ຄູ່ກັບ 也 ເປັນຫຼັກ"]}
],
6:[
{"t":"何况","s":"…，何况 + กรณีที่ชัดกว่า","th":"ยิ่งไม่ต้องพูดถึง… ใช้ต่อยอดจากประโยคก่อนหน้าเพื่อเสริมน้ำหนัก มักคู่กับ 连…都… ในประโยคแรก","lo":"ຍິ່ງບໍ່ຕ້ອງເວົ້າເຖິງ… ໃຊ້ຕໍ່ຍອດຈາກປະໂຫຍກກ່ອນໜ້າ","en":"Let alone — escalates from the preceding clause, often paired with 连…都… before it.","ex":[["连大人都搬不动，何况孩子呢？","Lián dàrén dōu bān bu dòng, hékuàng háizi ne?","ขนาดผู้ใหญ่ยังยกไม่ไหว นับประสาอะไรกับเด็ก","ຂະໜາດຜູ້ໃຫຍ່ຍັງຍົກບໍ່ໄຫວ ນັບປະສາຫຍັງກັບເດັກ","Even adults can't lift it, let alone a child."]],"bad":["何况孩子搬不动。","连大人都搬不动，何况孩子呢？","何况 ต้องมีประโยคนำหน้าเสมอ ใช้เดี่ยวไม่ได้","何况 ຕ້ອງມີປະໂຫຍກນຳໜ້າສະເໝີ"]},
{"t":"以免","s":"…，以免 + ผลเสียที่ไม่อยากให้เกิด","th":"เพื่อหลีกเลี่ยงไม่ให้เกิด… หลัง 以免 ต้องเป็นสิ่งไม่ดี และห้ามใส่ 不 ซ้ำ เพราะความหมายปฏิเสธอยู่ในตัวแล้ว","lo":"ເພື່ອຫຼີກລ້ຽງບໍ່ໃຫ້ເກີດ… ຫ້າມໃສ່ 不 ຊ້ຳ","en":"So as to avoid. What follows must be undesirable, and never add 不 — negation is built in.","ex":[["请提前确认，以免出现误会。","Qǐng tíqián quèrèn, yǐmiǎn chūxiàn wùhuì.","กรุณายืนยันล่วงหน้า เพื่อไม่ให้เกิดความเข้าใจผิด","ກະລຸນາຢືນຢັນລ່ວງໜ້າ ເພື່ອບໍ່ໃຫ້ເກີດຄວາມເຂົ້າໃຈຜິດ","Please confirm in advance to avoid misunderstanding."]],"bad":["以免不出现误会","以免出现误会","以免 มีความหมายปฏิเสธในตัว ห้ามเติม 不","以免 ມີຄວາມໝາຍປະຕິເສດໃນໂຕ"]},
{"t":"尽管……还是……","s":"尽管 + ข้อเท็จจริง，还是 + ผลที่ไม่เปลี่ยน","th":"ถึงแม้ว่า…ก็ยัง… คล้าย 虽然 แต่เป็นทางการกว่า ระวังสับสนกับ 尽管 อีกความหมายที่แปลว่า เชิญตามสบาย","lo":"ເຖິງແມ່ນວ່າ…ກໍຍັງ… ຄ້າຍ 虽然 ແຕ່ເປັນທາງການກວ່າ","en":"Even though — like 虽然 but more formal. Do not confuse with 尽管 meaning go right ahead.","ex":[["尽管条件有限，项目还是按时完成了。","Jǐnguǎn tiáojiàn yǒuxiàn, xiàngmù háishi ànshí wánchéng le.","แม้เงื่อนไขจะจำกัด โครงการก็ยังเสร็จตามกำหนด","ເຖິງເງື່ອນໄຂຈະຈຳກັດ ໂຄງການກໍຍັງສຳເລັດຕາມກຳນົດ","Despite limited resources, the project finished on time."]],"bad":["尽管条件有限，但项目完成。","尽管条件有限，项目还是按时完成了。","ประโยคหลังควรมี 还是 หรือ 但 เพื่อแสดงการขัดแย้ง","ປະໂຫຍກຫຼັງຄວນມີ 还是 ຫຼື 但"]},
{"t":"反而","s":"…，反而 + ผลตรงข้ามกับที่คาด","th":"กลับกลายเป็นตรงกันข้าม ใช้เมื่อผลลัพธ์สวนทางกับสิ่งที่ควรจะเป็น ต้องมีบริบทความคาดหวังมาก่อน","lo":"ກັບກາຍເປັນກົງກັນຂ້າມ ຕ້ອງມີບໍລິບົດຄາດຫວັງມາກ່ອນ","en":"On the contrary — the outcome runs against expectation, which must be set up first.","ex":[["他不但没生气，反而笑了。","Tā búdàn méi shēngqì, fǎn'ér xiào le.","เขาไม่เพียงไม่โกรธ กลับหัวเราะเสียอีก","ລາວບໍ່ພຽງບໍ່ຮ້າຍ ກັບຫົວເລາະເສຍອີກ","Far from getting angry, he laughed."]],"bad":["他反而笑了。","他不但没生气，反而笑了。","反而 ต้องมีบริบทที่ขัดกับความคาดหมายมาก่อน","反而 ຕ້ອງມີບໍລິບົດຂັດກັບຄວາມຄາດໝາຍມາກ່ອນ"]},
{"t":"一旦……就……","s":"一旦 + เงื่อนไขในอนาคต，就 + ผล","th":"หากวันใดที่…ก็จะ… ใช้กับเหตุการณ์สมมติในอนาคตที่มีน้ำหนัก ต่างจาก 一……就…… ที่เป็นเรื่องเกิดจริงตามลำดับ","lo":"ຫາກມື້ໃດທີ່…ກໍຈະ… ໃຊ້ກັບເຫດການສົມມຸດໃນອະນາຄົດ","en":"Once X happens, then Y — a weighty hypothetical future, unlike 一…就… for real sequence.","ex":[["一旦决定了，就不要轻易改变。","Yídàn juédìng le, jiù búyào qīngyì gǎibiàn.","เมื่อตัดสินใจแล้ว ก็อย่าเปลี่ยนใจง่ายๆ","ເມື່ອຕັດສິນໃຈແລ້ວ ກໍຢ່າປ່ຽນໃຈງ່າຍໆ","Once decided, don't change lightly."]],"bad":["一旦他回家，就睡觉了。","他一回家就睡觉。","เรื่องที่เกิดเป็นกิจวัตรใช้ 一……就……","ເລື່ອງທີ່ເກີດເປັນກິດຈະວັດໃຊ້ 一……就……"]},
{"t":"所","s":"所 + กริยา + 的 + นาม  ·  为/被 + ผู้กระทำ + 所 + กริยา","th":"เป็นคำในภาษาเขียนที่ทำให้กริยากลายเป็นส่วนขยายของคำนาม เช่น 我所知道的事 แปลว่า เรื่องที่ฉันรู้ ถ้าใช้กับ 为……所…… จะเป็นรูปถูกกระทำแบบทางการ","lo":"ເປັນຄຳໃນພາສາຂຽນທີ່ເຮັດໃຫ້ກະລິຍາກາຍເປັນສ່ວນຂະຫຍາຍຂອງຄຳນາມ ຖ້າໃຊ້ກັບ 为……所…… ຈະເປັນຮູບຖືກກະທຳແບບທາງການ","en":"A written-style particle that turns a verb into a noun modifier (我所知道的 = what I know). 为…所… is the formal passive.","ex":[["这是我所知道的全部。","Zhè shì wǒ suǒ zhīdào de quánbù.","นี่คือทั้งหมดที่ฉันรู้","ນີ້ແມ່ນທັງໝົດທີ່ຂ້ອຍຮູ້","This is everything I know."],["他的作品为大家所喜爱。","Tā de zuòpǐn wéi dàjiā suǒ xǐ'ài.","ผลงานของเขาเป็นที่รักของทุกคน","ຜົນງານຂອງລາວເປັນທີ່ຮັກຂອງທຸກຄົນ","His works are loved by everyone."]],"bad":["这是我所知道全部。","这是我所知道的全部。","โครงสร้าง 所 + กริยา ต้องมี 的 ปิดท้ายก่อนคำนาม","ໂຄງສ້າງ 所 + ກະລິຍາ ຕ້ອງມີ 的 ປິດທ້າຍກ່ອນຄຳນາມ"]},
{"t":"而","s":"A 而 B","th":"คำเชื่อมในภาษาเขียนที่มีสามหน้าที่ หนึ่งเชื่อมสิ่งที่ไปด้วยกัน สองแสดงความขัดแย้งแบบ แต่ สามเชื่อมลำดับเหตุและผล ต้องดูบริบทว่าเป็นแบบไหน","lo":"ຄຳເຊື່ອມໃນພາສາຂຽນທີ່ມີສາມໜ້າທີ່ ເຊື່ອມສິ່ງທີ່ໄປນຳກັນ ສະແດງຄວາມຂັດແຍ້ງ ແລະ ເຊື່ອມລຳດັບເຫດຜົນ","en":"A written connector with three roles: linking parallel ideas, marking contrast (but), and showing sequence or cause.","ex":[["这道菜简单而美味。","Zhè dào cài jiǎndān ér měiwèi.","อาหารจานนี้ทั้งง่ายและอร่อย","ອາຫານຈານນີ້ທັງງ່າຍແລະແຊບ","This dish is simple yet delicious."],["他不是不会，而是不想。","Tā bú shì bú huì, érshì bù xiǎng.","เขาไม่ใช่ทำไม่ได้ แต่คือไม่อยากทำ","ລາວບໍ່ແມ່ນເຮັດບໍ່ໄດ້ ແຕ່ຄືບໍ່ຢາກເຮັດ","It's not that he can't, but that he won't."]],"bad":["这道菜简单和美味。","这道菜简单而美味。","และ ที่เชื่อมคำคุณศัพท์ในภาษาเขียนใช้ 而 ไม่ใช่ 和","ແລະ ທີ່ເຊື່ອມຄຳຄຸນນາມໃນພາສາຂຽນໃຊ້ 而"]},
{"t":"之","s":"A + 之 + B","th":"เทียบเท่ากับ 的 แต่ใช้ในภาษาเขียนและสำนวนโบราณ มักเจอในหัวข้อข่าว ชื่อหนังสือ และสำนวน เช่น 之一 แปลว่า หนึ่งใน","lo":"ທຽບເທົ່າກັບ 的 ແຕ່ໃຊ້ໃນພາສາຂຽນ ມັກພົບໃນຫົວຂໍ້ຂ່າວ ຊື່ປຶ້ມ ແລະ ສຳນວນ","en":"The literary equivalent of 的, seen in headlines, titles and set phrases such as …之一 (one of the…).","ex":[["这是世界之最。","Zhè shì shìjiè zhī zuì.","นี่คือที่สุดของโลก","ນີ້ແມ່ນທີ່ສຸດຂອງໂລກ","This is the world's finest."],["他是最好的选手之一。","Tā shì zuì hǎo de xuǎnshǒu zhī yī.","เขาเป็นหนึ่งในนักกีฬาที่เก่งที่สุด","ລາວແມ່ນໜຶ່ງໃນນັກກິລາທີ່ເກັ່ງທີ່ສຸດ","He is one of the best players."]],"bad":["他是最好的选手一之。","他是最好的选手之一。","สำนวนนี้เรียงตายตัวว่า 之一 เท่านั้น","ສຳນວນນີ້ຮຽງຕາຍໂຕວ່າ 之一 ເທົ່ານັ້ນ"]},
{"t":"则","s":"A，B 则 …","th":"เป็น 就 หรือ 却 ในภาษาเขียน ใช้เชื่อมสองสิ่งที่นำมาเทียบกัน โดยวางไว้หลังประธานของประโยคที่สอง ไม่ใช่ต้นประโยค","lo":"ເປັນ 就 ຫຼື 却 ໃນພາສາຂຽນ ໃຊ້ເຊື່ອມສອງສິ່ງທີ່ນຳມາທຽບກັນ ວາງໄວ້ຫຼັງປະທານ","en":"The written form of 就 or 却, used to contrast two things. It follows the subject of the second clause.","ex":[["南方多雨，北方则干燥。","Nánfāng duō yǔ, běifāng zé gānzào.","ภาคใต้ฝนชุก ส่วนภาคเหนือแห้งแล้ง","ພາກໃຕ້ຝົນຫຼາຍ ສ່ວນພາກເໜືອແຫ້ງແລ້ງ","The south is rainy, whereas the north is dry."]],"bad":["南方多雨，则北方干燥。","南方多雨，北方则干燥。","则 ต้องอยู่หลังประธาน ไม่ใช่ต้นประโยค","则 ຕ້ອງຢູ່ຫຼັງປະທານ"]},
{"t":"以便","s":"…，以便 + ผลที่ต้องการให้เกิด","th":"แปลว่า เพื่อที่จะได้… ใช้บอกวัตถุประสงค์ที่ดี ต่างจาก 以免 ที่บอกสิ่งที่ไม่อยากให้เกิด สองคำนี้เป็นคู่ตรงข้ามกัน","lo":"ແປວ່າ ເພື່ອທີ່ຈະໄດ້… ໃຊ້ບອກຈຸດປະສົງທີ່ດີ ຕ່າງຈາກ 以免 ທີ່ບອກສິ່ງທີ່ບໍ່ຢາກໃຫ້ເກີດ","en":"So that (something good) can happen — the mirror image of 以免 (so as to avoid).","ex":[["请留下电话，以便我们联系您。","Qǐng liúxià diànhuà, yǐbiàn wǒmen liánxì nín.","กรุณาทิ้งเบอร์ไว้ เพื่อที่เราจะได้ติดต่อกลับ","ກະລຸນາປະເບີໄວ້ ເພື່ອທີ່ພວກເຮົາຈະຕິດຕໍ່ກັບ","Please leave your number so we can contact you."]],"bad":["请留下电话，以免我们联系您。","请留下电话，以便我们联系您。","สิ่งที่ต้องการให้เกิดใช้ 以便 ส่วน 以免 ใช้กับสิ่งไม่ดี","ສິ່ງທີ່ຕ້ອງການໃຫ້ເກີດໃຊ້ 以便"]},
{"t":"以致 / 以至于","s":"เหตุ，以致(于) + ผลที่ตามมา","th":"แปลว่า จนส่งผลให้ ใช้กับผลลัพธ์ที่มักไม่ดีหรือเกินคาด ต่างจาก 因此 ที่เป็นกลาง","lo":"ແປວ່າ ຈົນສົ່ງຜົນໃຫ້ ໃຊ້ກັບຜົນລັບທີ່ມັກບໍ່ດີ ຕ່າງຈາກ 因此 ທີ່ເປັນກາງ","en":"So that (a usually unwelcome result followed) — unlike the neutral 因此.","ex":[["他太紧张，以致忘了台词。","Tā tài jǐnzhāng, yǐzhì wàng le táicí.","เขาตื่นเต้นมากจนลืมบท","ລາວຕື່ນເຕັ້ນຫຼາຍຈົນລືມບົດ","He was so nervous that he forgot his lines."]],"bad":["他很努力，以致成功了。","他很努力，因此成功了。","ผลลัพธ์ที่ดีใช้ 因此 ส่วน 以致 ใช้กับผลไม่ดี","ຜົນລັບທີ່ດີໃຊ້ 因此"]},
{"t":"不至于","s":"不至于 + ผลร้ายแรง","th":"แปลว่า คงไม่ถึงขั้น… ใช้ปฏิเสธความเป็นไปได้ที่จะเลวร้ายถึงระดับนั้น มักใช้ปลอบใจหรือประเมินสถานการณ์","lo":"ແປວ່າ ຄົງບໍ່ເຖິງຂັ້ນ… ໃຊ້ປະຕິເສດຄວາມເປັນໄປໄດ້ທີ່ຈະຮ້າຍແຮງເຖິງລະດັບນັ້ນ","en":"Surely it won't go so far as… — used to reassure or to gauge a situation.","ex":[["虽然难，但还不至于放弃。","Suīrán nán, dàn hái bú zhìyú fàngqì.","ถึงจะยาก แต่ก็ยังไม่ถึงขั้นต้องยอมแพ้","ເຖິງຈະຍາກ ແຕ່ກໍຍັງບໍ່ເຖິງຂັ້ນຕ້ອງຍອມແພ້","It's hard, but not to the point of giving up."]],"bad":["还不至于不放弃。","还不至于放弃。","不至于 มีความหมายปฏิเสธในตัวแล้ว ห้ามใส่ 不 ซ้ำ","不至于 ມີຄວາມໝາຍປະຕິເສດໃນໂຕແລ້ວ"]},
{"t":"固然……但是……","s":"固然 + ข้อเท็จจริงที่ยอมรับ，但是 + ประเด็นหลัก","th":"แปลว่า จริงอยู่ที่…แต่… ใช้ยอมรับข้อดีของอีกฝ่ายก่อนแล้วค่อยเสนอความเห็นตัวเอง เป็นวิธีโต้แย้งอย่างสุภาพในงานเขียน","lo":"ແປວ່າ ຈິງຢູ່ທີ່…ແຕ່… ໃຊ້ຍອມຮັບຂໍ້ດີຂອງອີກຝ່າຍກ່ອນແລ້ວຄ່ອຍສະເໜີຄວາມເຫັນຕົນເອງ","en":"Admittedly X, but Y — a polite way to concede a point before making your own.","ex":[["金钱固然重要，但不是一切。","Jīnqián gùrán zhòngyào, dàn bú shì yíqiè.","เงินสำคัญก็จริง แต่ไม่ใช่ทุกอย่าง","ເງິນສຳຄັນກໍຈິງ ແຕ່ບໍ່ແມ່ນທຸກຢ່າງ","Money matters, to be sure, but it isn't everything."]],"bad":["虽然金钱固然重要，但不是一切。","金钱固然重要，但不是一切。","固然 ทำหน้าที่แทน 虽然 อยู่แล้ว ห้ามใช้ซ้อนกัน","固然 ເຮັດໜ້າທີ່ແທນ 虽然 ຢູ່ແລ້ວ"]},
{"t":"与其说……不如说……","s":"与其说 A，不如说 B","th":"ต่างจาก 与其……不如…… ที่ใช้เลือกทางเดิน อันนี้ใช้เลือกวิธีอธิบาย แปลว่า จะว่า A ก็ไม่เท่ากับว่าเป็น B มากกว่า","lo":"ຕ່າງຈາກ 与其……不如…… ທີ່ໃຊ້ເລືອກທາງເດີນ ອັນນີ້ໃຊ້ເລືອກວິທີອະທິບາຍ","en":"Rather than saying A, it's better to say B — about how to describe something, not what to do.","ex":[["与其说是运气，不如说是努力。","Yǔqí shuō shì yùnqi, bùrú shuō shì nǔlì.","จะว่าเป็นโชค ยังไม่เท่าว่าเป็นความพยายาม","ຈະວ່າເປັນໂຊກ ຍັງບໍ່ເທົ່າວ່າເປັນຄວາມພະຍາຍາມ","Rather than luck, call it hard work."]],"bad":["与其是运气，不如是努力。","与其说是运气，不如说是努力。","รูปนี้ต้องมี 说 ทั้งสองข้าง","ຮູບນີ້ຕ້ອງມີ 说 ທັງສອງຂ້າງ"]},
{"t":"就是……也……","s":"就是 + สมมติสุดขั้ว，也 + ผลที่ไม่เปลี่ยน","th":"แปลว่า ต่อให้…ก็ยัง… คล้าย 即使……也…… แต่เป็นภาษาพูดมากกว่า ระวังสับสนกับ 就是 ที่แปลว่า คือ","lo":"ແປວ່າ ຕໍ່ໃຫ້…ກໍຍັງ… ຄ້າຍ 即使……也…… ແຕ່ເປັນພາສາເວົ້າກວ່າ","en":"Even if X, still Y — the colloquial cousin of 即使…也….","ex":[["就是下刀子我也要去。","Jiùshì xià dāozi wǒ yě yào qù.","ต่อให้ฟ้าถล่มฉันก็จะไป","ຕໍ່ໃຫ້ຟ້າຖະຫຼົ່ມຂ້ອຍກໍຈະໄປ","I'll go even if it rains knives."]],"bad":["就是下雨，我要去。","就是下雨，我也要去。","โครงสร้างนี้ต้องมี 也 ในประโยคหลัง","ໂຄງສ້າງນີ້ຕ້ອງມີ 也 ໃນປະໂຫຍກຫຼັງ"]},
{"t":"无论如何","s":"无论如何 + 都/也 + …","th":"แปลว่า ไม่ว่าอย่างไรก็ตาม ใช้ยืนยันว่าจะทำหรือจะไม่ทำแน่นอน ต่างจาก 无论 ทั่วไปตรงที่เป็นวลีสำเร็จรูป ไม่ต้องเติมคำถามต่อท้าย","lo":"ແປວ່າ ບໍ່ວ່າແນວໃດກໍຕາມ ໃຊ້ຢືນຢັນວ່າຈະເຮັດຫຼືບໍ່ເຮັດແນ່ນອນ","en":"In any case, whatever happens — a fixed phrase, unlike plain 无论 which needs a question word.","ex":[["无论如何，我都会支持你。","Wúlùn rúhé, wǒ dōu huì zhīchí nǐ.","ไม่ว่ายังไงฉันก็จะสนับสนุนคุณ","ບໍ່ວ່າແນວໃດຂ້ອຍກໍຈະສະໜັບສະໜູນເຈົ້າ","Whatever happens, I'll support you."]],"bad":["无论如何什么，我都支持你。","无论如何，我都支持你。","วลีนี้สมบูรณ์ในตัวแล้ว ห้ามเติมคำถามต่อ","ວະລີນີ້ສົມບູນໃນໂຕແລ້ວ"]},
{"t":"在……的同时","s":"在 + เหตุการณ์ + 的同时，…","th":"แปลว่า ในขณะที่…ไปด้วยก็… ใช้บอกว่าสองสิ่งเกิดควบคู่กัน ต่างจาก 一边……一边…… ที่ใช้กับการกระทำง่ายๆ ในชีวิตประจำวัน อันนี้เป็นทางการกว่า","lo":"ແປວ່າ ໃນຂະນະທີ່…ໄປນຳກໍ… ໃຊ້ບອກວ່າສອງສິ່ງເກີດຄວບຄູ່ກັນ ເປັນທາງການກວ່າ 一边……一边……","en":"While X is happening, Y also… More formal than 一边…一边….","ex":[["在发展经济的同时，也要保护环境。","Zài fāzhǎn jīngjì de tóngshí, yě yào bǎohù huánjìng.","ในขณะที่พัฒนาเศรษฐกิจ ก็ต้องปกป้องสิ่งแวดล้อมด้วย","ໃນຂະນະທີ່ພັດທະນາເສດຖະກິດ ກໍຕ້ອງປົກປ້ອງສິ່ງແວດລ້ອມ","While developing the economy, we must also protect the environment."]],"bad":["在发展经济同时，也要保护环境。","在发展经济的同时，也要保护环境。","โครงสร้างนี้ต้องมี 的 ก่อน 同时","ໂຄງສ້າງນີ້ຕ້ອງມີ 的 ກ່ອນ 同时"]},
{"t":"一来……二来……","s":"一来 + เหตุผลที่ 1，二来 + เหตุผลที่ 2","th":"ใช้ไล่เรียงเหตุผลทีละข้อ คล้ายพูดว่า อย่างแรก…อย่างที่สอง… เป็นภาษาพูดที่ใช้บ่อยเวลาอธิบายว่าทำไมถึงตัดสินใจแบบนั้น","lo":"ໃຊ້ໄລ່ລຽງເຫດຜົນເທື່ອລະຂໍ້ ຄ້າຍເວົ້າວ່າ ຢ່າງທຳອິດ…ຢ່າງທີສອງ…","en":"For one thing… for another… A conversational way to list reasons.","ex":[["我不去，一来太远，二来太贵。","Wǒ bú qù, yī lái tài yuǎn, èr lái tài guì.","ฉันไม่ไป อย่างแรกไกลเกิน อย่างที่สองแพงเกิน","ຂ້ອຍບໍ່ໄປ ຢ່າງທຳອິດໄກເກີນ ຢ່າງທີສອງແພງເກີນ","I'm not going — for one it's too far, for another too expensive."]],"bad":["一来太远，两来太贵。","一来太远，二来太贵。","ต้องใช้ 二来 ไม่ใช่ 两来","ຕ້ອງໃຊ້ 二来 ບໍ່ແມ່ນ 两来"]},
{"t":"果然 / 居然 / 竟然","s":"ประธาน + 果然/居然/竟然 + กริยา","th":"สามคำนี้ใช้กับผลลัพธ์ที่เกิดขึ้นจริง แต่ทัศนคติต่างกันสิ้นเชิง 果然 คือเป็นไปตามที่คาดไว้จริงๆ ส่วน 居然 กับ 竟然 คือคาดไม่ถึงเลย โดย 居然 แปลกใจกว่า","lo":"ສາມຄຳນີ້ໃຊ້ກັບຜົນລັບທີ່ເກີດຂຶ້ນຈິງ ແຕ່ທັດສະນະຕ່າງກັນ 果然 ຄືເປັນໄປຕາມທີ່ຄາດ ສ່ວນ 居然 ກັບ 竟然 ຄືຄາດບໍ່ເຖິງ","en":"果然 = just as expected; 居然 and 竟然 = unexpectedly, with 居然 showing more surprise.","ex":[["他果然来了。","Tā guǒrán lái le.","เขามาจริงๆ ด้วย (อย่างที่คิดไว้)","ລາວມາແທ້ (ຄືທີ່ຄິດໄວ້)","He came, just as I thought."],["他居然没来！","Tā jūrán méi lái!","เขาไม่มาซะงั้น! (คาดไม่ถึง)","ລາວບໍ່ມາຊະງັ້ນ!","He actually didn't come!"]],"bad":["我猜他会来，他居然来了。","我猜他会来，他果然来了。","เป็นไปตามที่คาดต้องใช้ 果然","ເປັນໄປຕາມທີ່ຄາດຕ້ອງໃຊ້ 果然"]}
]};

const R={"3":[{"t":"我的周末","zh":"我每个周末都很忙。星期六早上我去公园锻炼，然后回家打扫房间。下午我常常和朋友一起去看电影或者逛街。星期天我要复习功课，因为星期一有考试。虽然很累，但是我觉得这样的生活很有意思。","tr":["ทุกสุดสัปดาห์ฉันยุ่งมาก เช้าวันเสาร์ฉันไปออกกำลังกายที่สวนสาธารณะ แล้วกลับบ้านทำความสะอาดห้อง ตอนบ่ายฉันมักไปดูหนังหรือเดินเล่นกับเพื่อน วันอาทิตย์ต้องทบทวนบทเรียนเพราะวันจันทร์มีสอบ ถึงจะเหนื่อยแต่ฉันว่าชีวิตแบบนี้น่าสนใจดี","ທຸກທ້າຍອາທິດຂ້ອຍຫຍຸ້ງຫຼາຍ ເຊົ້າວັນເສົາຂ້ອຍໄປອອກກຳລັງກາຍຢູ່ສວນສາທາລະນະ ແລ້ວກັບບ້ານອະນາໄມຫ້ອງ ຕອນບ່າຍມັກໄປເບິ່ງຮູບເງົາຫຼືຍ່າງຫຼິ້ນກັບໝູ່ ວັນອາທິດຕ້ອງທົບທວນບົດຮຽນເພາະວັນຈັນມີສອບ","I'm busy every weekend. Saturday morning I exercise in the park, then go home and clean my room. In the afternoon I often watch a film or go shopping with friends. On Sunday I revise because there's an exam on Monday. It's tiring, but I find this life interesting."],"q":[["他星期六早上做什么？",["เช้าวันเสาร์เขาทำอะไร","ເຊົ້າວັນເສົາລາວເຮັດຫຍັງ","What does he do on Saturday morning?"],["去公园锻炼","打扫房间","看电影","复习功课"],0,["ประโยคที่สองบอกว่า 星期六早上我去公园锻炼 ส่วนทำความสะอาดห้องเป็นสิ่งที่ทำหลังกลับบ้าน","ປະໂຫຍກທີສອງບອກວ່າ ເຊົ້າວັນເສົາໄປສວນສາທາລະນະ","The second sentence says he exercises in the park first; cleaning comes after."]],["他星期天为什么要复习？",["ทำไมวันอาทิตย์เขาต้องทบทวนบทเรียน","ເປັນຫຍັງວັນອາທິດລາວຕ້ອງທົບທວນ","Why does he revise on Sunday?"],["因为他喜欢学习","因为星期一有考试","因为老师让他复习","因为他没事做"],1,["ข้อความบอกชัดว่า 因为星期一有考试","ຂໍ້ຄວາມບອກຊັດວ່າ ວັນຈັນມີສອບ","The text states: because there's an exam on Monday."]],["他觉得自己的周末怎么样？",["เขารู้สึกอย่างไรกับสุดสัปดาห์ของตัวเอง","ລາວຮູ້ສຶກແນວໃດກັບທ້າຍອາທິດຂອງໂຕເອງ","How does he feel about his weekends?"],["很无聊","很轻松","很有意思","很难过"],2,["ประโยคสุดท้ายใช้ 虽然很累，但是…很有意思 คำหลัง 但是 คือใจความหลัก","ປະໂຫຍກສຸດທ້າຍໃຊ້ 虽然…但是… ຄຳຫຼັງ 但是 ຄືໃຈຄວາມຫຼັກ","The clause after 但是 carries the main point: interesting."]]]},{"t":"借书","zh":"昨天我去图书馆借书。我想借的那本书已经被别人借走了，服务员告诉我下个星期才能还回来。她让我先留下电话号码，书还回来以后她会打电话通知我。我觉得这个服务很方便。","tr":["เมื่อวานฉันไปยืมหนังสือที่ห้องสมุด หนังสือที่ฉันอยากยืมถูกคนอื่นยืมไปแล้ว พนักงานบอกว่าอีกสัปดาห์หน้าถึงจะคืน เธอให้ฉันทิ้งเบอร์โทรไว้ก่อน พอหนังสือคืนมาแล้วเธอจะโทรมาแจ้ง ฉันว่าบริการนี้สะดวกมาก","ມື້ວານຂ້ອຍໄປຢືມປຶ້ມຢູ່ຫໍສະໝຸດ ປຶ້ມທີ່ຂ້ອຍຢາກຢືມຖືກຄົນອື່ນຢືມໄປແລ້ວ ພະນັກງານບອກວ່າອາທິດໜ້າຈຶ່ງຈະສົ່ງຄືນ ລາວໃຫ້ຂ້ອຍປະເບີໂທໄວ້ ພໍປຶ້ມຄືນມາຈະໂທມາແຈ້ງ","Yesterday I went to the library to borrow a book. The one I wanted had already been borrowed; the assistant said it would only come back next week. She asked me to leave my phone number and said she'd call once it was returned. I think this service is very convenient."],"q":[["那本书现在在哪儿？",["ตอนนี้หนังสือเล่มนั้นอยู่ที่ไหน","ດຽວນີ້ປຶ້ມຫົວນັ້ນຢູ່ໃສ","Where is that book now?"],["在图书馆","在别人那儿","在他家","在书店"],1,["ประโยค 已经被别人借走了 ใช้รูป 被 แปลว่าถูกคนอื่นยืมไปแล้ว","ປະໂຫຍກໃຊ້ຮູບ 被 ແປວ່າຖືກຄົນອື່ນຢືມໄປແລ້ວ","被别人借走了 means someone else has taken it."]],["服务员让他做什么？",["พนักงานให้เขาทำอะไร","ພະນັກງານໃຫ້ລາວເຮັດຫຍັງ","What did the assistant ask him to do?"],["下星期再来","留下电话号码","去别的图书馆","买一本新的"],1,["ข้อความบอกว่า 她让我先留下电话号码","ຂໍ້ຄວາມບອກວ່າ ລາວໃຫ້ປະເບີໂທໄວ້","The text says she asked him to leave his phone number."]],["书还回来以后会怎么样？",["หลังหนังสือถูกคืนแล้วจะเกิดอะไรขึ้น","ຫຼັງປຶ້ມຖືກສົ່ງຄືນຈະເກີດຫຍັງຂຶ້ນ","What happens after the book is returned?"],["他要自己去问","服务员会打电话","书会被别人借走","图书馆会关门"],1,["ประโยครองสุดท้ายบอกว่า 她会打电话通知我","ປະໂຫຍກຮອງສຸດທ້າຍບອກວ່າຈະໂທມາແຈ້ງ","She will phone to let him know."]]]}],"4":[{"t":"面试的经验","zh":"上个月我去一家公司面试。为了准备这次面试，我提前查了很多关于这家公司的资料，还请朋友帮我练习回答问题。面试那天我提前半个小时到了，虽然还是有点儿紧张，但是回答得比我想象的好。一个星期以后，公司通知我被录取了。这次经历让我明白，机会总是留给有准备的人。","tr":["เดือนที่แล้วฉันไปสัมภาษณ์งานที่บริษัทแห่งหนึ่ง เพื่อเตรียมตัว ฉันหาข้อมูลเกี่ยวกับบริษัทไว้ล่วงหน้าเยอะมาก แล้วยังขอให้เพื่อนช่วยซ้อมตอบคำถามด้วย วันสัมภาษณ์ฉันไปถึงก่อนครึ่งชั่วโมง ถึงจะยังตื่นเต้นอยู่บ้าง แต่ก็ตอบได้ดีกว่าที่คิดไว้ อีกหนึ่งสัปดาห์บริษัทแจ้งว่าฉันได้รับเลือก ประสบการณ์ครั้งนี้ทำให้ฉันเข้าใจว่า โอกาสมักเป็นของคนที่เตรียมพร้อมเสมอ","ເດືອນແລ້ວຂ້ອຍໄປສຳພາດວຽກຢູ່ບໍລິສັດແຫ່ງໜຶ່ງ ເພື່ອກຽມໂຕ ຂ້ອຍຫາຂໍ້ມູນກ່ຽວກັບບໍລິສັດໄວ້ລ່ວງໜ້າຫຼາຍ ແລະ ຂໍໃຫ້ໝູ່ຊ່ວຍຊ້ອມຕອບຄຳຖາມ ມື້ສຳພາດຂ້ອຍໄປຮອດກ່ອນເຄິ່ງຊົ່ວໂມງ ອາທິດຕໍ່ມາບໍລິສັດແຈ້ງວ່າຂ້ອຍໄດ້ຮັບເລືອກ","Last month I had an interview at a company. To prepare, I researched the company in advance and asked a friend to help me practise answering questions. On the day I arrived half an hour early; I was still a little nervous, but I answered better than I'd expected. A week later they told me I'd been hired. This taught me that opportunity favours the prepared."],"q":[["他为面试做了哪些准备？",["เขาเตรียมตัวสัมภาษณ์อย่างไรบ้าง","ລາວກຽມໂຕສຳພາດແນວໃດ","How did he prepare for the interview?"],["只查了资料","只找朋友练习","查资料并找朋友练习","什么都没准备"],2,["ข้อความบอกทั้งสองอย่าง คือ 查了很多资料 และ 请朋友帮我练习","ຂໍ້ຄວາມບອກທັງສອງຢ່າງ ຄື ຫາຂໍ້ມູນ ແລະ ຂໍໝູ່ຊ່ວຍຊ້ອມ","The text mentions both researching and practising with a friend."]],["面试当天他的表现怎么样？",["วันสัมภาษณ์เขาทำได้อย่างไร","ມື້ສຳພາດລາວເຮັດໄດ້ແນວໃດ","How did he perform on the day?"],["比想象的好","很不好","完全不紧张","忘了回答"],0,["ประโยคใช้ 回答得比我想象的好 ซึ่งเป็นการเปรียบเทียบด้วย 比","ປະໂຫຍກໃຊ້ 比 ປຽບທຽບວ່າດີກວ່າທີ່ຄິດ","比我想象的好 = better than he had imagined."]],["这篇短文主要想告诉我们什么？",["บทความนี้ต้องการบอกอะไรเป็นหลัก","ບົດຄວາມນີ້ຕ້ອງການບອກຫຍັງເປັນຫຼັກ","What is the main message?"],["面试很难","要提前半小时到","准备好的人才能抓住机会","朋友很重要"],2,["ประโยคสุดท้ายคือใจความหลัก 机会总是留给有准备的人","ປະໂຫຍກສຸດທ້າຍຄືໃຈຄວາມຫຼັກ","The final sentence states the main idea."]]]},{"t":"网上购物","zh":"现在越来越多的人喜欢在网上买东西。网上购物不但方便，而且价格常常比商店便宜。不过，网上买东西也有缺点：你看不到真的商品，收到以后可能会失望。所以买之前最好看看别人的评价，特别是买衣服的时候，还要注意尺寸。只要小心一点儿，网上购物是很好的选择。","tr":["ทุกวันนี้คนนิยมซื้อของออนไลน์มากขึ้นเรื่อยๆ การซื้อของออนไลน์ไม่เพียงสะดวก แต่ราคายังมักถูกกว่าในร้านด้วย แต่ก็มีข้อเสียคือคุณไม่เห็นสินค้าจริง พอได้รับของอาจผิดหวังได้ ดังนั้นก่อนซื้อควรดูรีวิวของคนอื่น โดยเฉพาะเวลาซื้อเสื้อผ้าต้องดูขนาดให้ดี ขอแค่ระวังสักหน่อย การซื้อของออนไลน์ก็เป็นทางเลือกที่ดีมาก","ທຸກມື້ນີ້ຄົນນິຍົມຊື້ເຄື່ອງອອນລາຍຫຼາຍຂຶ້ນເລື້ອຍໆ ບໍ່ພຽງສະດວກ ແຕ່ລາຄາຍັງມັກຖືກກວ່າໃນຮ້ານ ແຕ່ກໍມີຂໍ້ເສຍຄືບໍ່ເຫັນສິນຄ້າຈິງ ດັ່ງນັ້ນກ່ອນຊື້ຄວນເບິ່ງຄຳຕິຊົມຂອງຄົນອື່ນ","More and more people like shopping online. It's not only convenient, the prices are often cheaper than in shops. But there is a downside: you can't see the real product and may be disappointed when it arrives. So it's best to read other people's reviews first, and with clothes, check the size. As long as you're a little careful, online shopping is a good choice."],"q":[["网上购物有什么优点？",["การซื้อของออนไลน์มีข้อดีอะไร","ການຊື້ເຄື່ອງອອນລາຍມີຂໍ້ດີຫຍັງ","What are the advantages of online shopping?"],["方便而且便宜","可以看到真商品","不用等","没有缺点"],0,["ข้อความใช้ 不但方便，而且价格常常比商店便宜","ຂໍ້ຄວາມໃຊ້ 不但…而且… ບອກທັງສະດວກແລະຖືກ","不但方便，而且…便宜 covers both."]],["买衣服的时候要特别注意什么？",["เวลาซื้อเสื้อผ้าต้องระวังอะไรเป็นพิเศษ","ເວລາຊື້ເສື້ອຜ້າຕ້ອງລະວັງຫຍັງເປັນພິເສດ","What needs special attention when buying clothes?"],["颜色","尺寸","价格","牌子"],1,["ข้อความระบุ 特别是买衣服的时候，还要注意尺寸","ຂໍ້ຄວາມລະບຸວ່າຕ້ອງເບິ່ງຂະໜາດ","The text says to check the size."]],["作者对网上购物的态度是什么？",["ผู้เขียนมีทัศนคติอย่างไรต่อการซื้อของออนไลน์","ຜູ້ຂຽນມີທັດສະນະແນວໃດ","What is the writer's attitude?"],["完全反对","比较支持","没有看法","觉得很危险"],1,["ประโยคสุดท้ายบอกว่า 只要小心一点儿…是很好的选择 จึงเป็นการสนับสนุนแบบมีเงื่อนไข","ປະໂຫຍກສຸດທ້າຍສະໜັບສະໜູນແບບມີເງື່ອນໄຂ","The closing sentence gives conditional approval."]]]},{"t":"锻炼身体","zh":"很多人知道锻炼对身体有好处，但是坚持下来的人却不多。其实锻炼不一定要去健身房，每天走路半个小时也很有效果。重要的不是运动的时间长短，而是能不能坚持。有的人一开始就每天跑一个小时，结果三天以后就放弃了。因此，专家建议大家从简单的开始，慢慢增加。","tr":["หลายคนรู้ว่าการออกกำลังกายดีต่อร่างกาย แต่คนที่ทำต่อเนื่องได้กลับมีไม่มาก จริงๆ แล้วการออกกำลังกายไม่จำเป็นต้องไปฟิตเนส เดินทุกวันวันละครึ่งชั่วโมงก็ได้ผลดี สิ่งสำคัญไม่ใช่ระยะเวลาที่ออกกำลัง แต่คือทำต่อเนื่องได้หรือไม่ บางคนเริ่มต้นด้วยการวิ่งวันละชั่วโมง ผลคือสามวันก็เลิก ผู้เชี่ยวชาญจึงแนะนำให้เริ่มจากง่ายๆ แล้วค่อยๆ เพิ่ม","ຫຼາຍຄົນຮູ້ວ່າການອອກກຳລັງກາຍດີຕໍ່ຮ່າງກາຍ ແຕ່ຄົນທີ່ເຮັດຕໍ່ເນື່ອງໄດ້ກັບມີບໍ່ຫຼາຍ ຄວາມຈິງແລ້ວບໍ່ຈຳເປັນຕ້ອງໄປຫ້ອງອອກກຳລັງກາຍ ຍ່າງທຸກມື້ເຄິ່ງຊົ່ວໂມງກໍໄດ້ຜົນ ສິ່ງສຳຄັນຄືເຮັດຕໍ່ເນື່ອງໄດ້ຫຼືບໍ່","Many people know exercise is good for them, yet few keep it up. In fact you don't need a gym — walking half an hour a day is effective. What matters isn't how long you exercise but whether you can keep going. Some start by running an hour a day and give up after three days. Experts therefore suggest starting simple and building up slowly."],"q":[["作者认为锻炼最重要的是什么？",["ผู้เขียนคิดว่าสิ่งสำคัญที่สุดของการออกกำลังกายคืออะไร","ຜູ້ຂຽນຄິດວ່າສິ່ງສຳຄັນທີ່ສຸດແມ່ນຫຍັງ","What does the writer think matters most?"],["时间长","去健身房","能坚持","跑得快"],2,["ใช้โครงสร้าง 不是……而是…… ซึ่งคำหลัง 而是 คือคำตอบ","ໃຊ້ໂຄງສ້າງ 不是……而是…… ຄຳຫຼັງ 而是 ຄືຄຳຕອບ","The 不是…而是… structure puts the answer after 而是."]],["为什么有人三天以后就放弃了？",["ทำไมบางคนสามวันก็เลิก","ເປັນຫຍັງບາງຄົນສາມມື້ກໍເຊົາ","Why do some people give up after three days?"],["因为没有时间","因为一开始就太多","因为不喜欢运动","因为身体不好"],1,["ข้อความยกตัวอย่าง 一开始就每天跑一个小时 คือเริ่มหนักเกินไป","ຂໍ້ຄວາມຍົກຕົວຢ່າງວ່າເລີ່ມໜັກເກີນໄປ","They started with too much at once."]],["专家的建议是什么？",["ผู้เชี่ยวชาญแนะนำอะไร","ຜູ້ຊ່ຽວຊານແນະນຳຫຍັງ","What do experts advise?"],["每天跑一小时","从简单的开始","一定要去健身房","不用锻炼"],1,["ประโยคสุดท้าย 从简单的开始，慢慢增加","ປະໂຫຍກສຸດທ້າຍ ເລີ່ມຈາກງ່າຍໆ ຄ່ອຍໆເພີ່ມ","Start simple and increase gradually."]]]}],"5":[{"t":"手机改变了生活","zh":"随着科技的发展，手机已经不只是打电话的工具。它让我们的生活变得更方便，无论是购物、付款还是学习，都可以在手机上完成。然而，凡事都有两面。不少人一天要看几百次手机，甚至吃饭和睡觉前也放不下。有研究表明，过度使用手机会影响睡眠质量，也会减少人与人之间面对面的交流。因此，我们与其抱怨科技，不如学会控制自己使用手机的时间。","tr":["เมื่อเทคโนโลยีพัฒนาขึ้น โทรศัพท์มือถือไม่ได้เป็นแค่เครื่องมือโทรออกอีกต่อไป มันทำให้ชีวิตเราสะดวกขึ้น ไม่ว่าจะซื้อของ จ่ายเงิน หรือเรียน ก็ทำบนมือถือได้หมด แต่ทุกอย่างมีสองด้าน หลายคนดูมือถือวันละหลายร้อยครั้ง แม้ตอนกินข้าวหรือก่อนนอนก็ยังวางไม่ลง มีงานวิจัยชี้ว่าการใช้มือถือมากเกินไปกระทบคุณภาพการนอน และลดการพูดคุยกันแบบเห็นหน้า ดังนั้นแทนที่จะบ่นเรื่องเทคโนโลยี เราควรเรียนรู้ที่จะควบคุมเวลาใช้มือถือของตัวเองมากกว่า","ເມື່ອເຕັກໂນໂລຊີພັດທະນາຂຶ້ນ ໂທລະສັບມືຖືບໍ່ໄດ້ເປັນພຽງເຄື່ອງມືໂທອອກອີກຕໍ່ໄປ ມັນເຮັດໃຫ້ຊີວິດສະດວກຂຶ້ນ ແຕ່ທຸກຢ່າງມີສອງດ້ານ ມີການຄົ້ນຄວ້າຊີ້ວ່າການໃຊ້ຫຼາຍເກີນໄປກະທົບຄຸນນະພາບການນອນ ດັ່ງນັ້ນແທນທີ່ຈະຈົ່ມເລື່ອງເຕັກໂນໂລຊີ ເຮົາຄວນຮຽນຮູ້ຄວບຄຸມເວລາໃຊ້ຂອງໂຕເອງ","As technology advances, the phone is no longer just a device for calling. It has made life more convenient — shopping, payment, study can all be done on it. Yet everything has two sides. Many check their phones hundreds of times a day and can't put them down even at meals or before bed. Research shows excessive use harms sleep quality and reduces face-to-face communication. Rather than complaining about technology, we should learn to control our own screen time."],"q":[["根据短文，手机带来了什么问题？",["ตามบทความ มือถือก่อปัญหาอะไร","ຕາມບົດຄວາມ ມືຖືກໍ່ບັນຫາຫຍັງ","According to the text, what problems has the phone brought?"],["影响睡眠和面对面交流","让购物变难","价格太高","让人不会打电话"],0,["ประโยค 有研究表明 ระบุสองข้อคือ 影响睡眠质量 กับ 减少面对面的交流","ປະໂຫຍກ 有研究表明 ລະບຸສອງຂໍ້","The research sentence lists both effects."]],["“凡事都有两面”在文中是什么意思？",["ประโยค 凡事都有两面 ในบทความหมายถึงอะไร","ປະໂຫຍກນີ້ໝາຍເຖິງຫຍັງ","What does 凡事都有两面 mean here?"],["手机有两个功能","任何事都有好处和坏处","手机分两种","要买两个手机"],1,["สำนวนนี้แปลว่าทุกเรื่องมีทั้งด้านดีและด้านเสีย ใช้เชื่อมจากย่อหน้าข้อดีไปสู่ข้อเสีย","ສຳນວນນີ້ແປວ່າທຸກເລື່ອງມີທັງດ້ານດີແລະດ້ານເສຍ","It means everything has both good and bad sides."]],["作者最后的建议是什么？",["ข้อเสนอสุดท้ายของผู้เขียนคืออะไร","ຂໍ້ສະເໜີສຸດທ້າຍຂອງຜູ້ຂຽນແມ່ນຫຍັງ","What does the writer finally suggest?"],["不要用手机","抱怨科技","控制使用时间","多买几个手机"],2,["ใช้โครงสร้าง 与其……不如…… ซึ่งผู้พูดเลือกข้อหลังเสมอ คือ 学会控制自己使用手机的时间","ໃຊ້ໂຄງສ້າງ 与其……不如…… ຜູ້ເວົ້າເລືອກຂໍ້ຫຼັງສະເໝີ","与其…不如… always favours the second option."]]]},{"t":"一个人旅行","zh":"最近几年，一个人旅行的人越来越多。有人认为这样太孤独，但对我来说，独自旅行反而是一种享受。没有人催你，也不用迁就别人的安排，想在哪个地方多待一会儿就多待一会儿。当然，一个人出门也需要更加小心，尤其是在陌生的城市。我的经验是：出发前一定要做好计划，把住的地方和路线提前确定下来，这样即使遇到问题也不至于慌张。","tr":["ไม่กี่ปีมานี้คนที่เที่ยวคนเดียวมีมากขึ้นเรื่อยๆ บางคนมองว่าเหงาเกินไป แต่สำหรับฉันแล้ว การเที่ยวคนเดียวกลับเป็นความสุขอย่างหนึ่ง ไม่มีใครมาเร่ง ไม่ต้องตามใจแผนของคนอื่น อยากอยู่ที่ไหนนานหน่อยก็อยู่ได้ แน่นอนว่าไปคนเดียวก็ต้องระวังมากขึ้น โดยเฉพาะในเมืองที่ไม่คุ้นเคย ประสบการณ์ของฉันคือ ก่อนออกเดินทางต้องวางแผนให้ดี กำหนดที่พักและเส้นทางไว้ล่วงหน้า แบบนี้ต่อให้เจอปัญหาก็ไม่ถึงขั้นตื่นตระหนก","ບໍ່ເທົ່າໃດປີມານີ້ຄົນທີ່ທ່ຽວຄົນດຽວມີຫຼາຍຂຶ້ນ ບາງຄົນວ່າເຫງົາເກີນໄປ ແຕ່ສຳລັບຂ້ອຍ ການທ່ຽວຄົນດຽວກັບເປັນຄວາມສຸກ ບໍ່ມີໃຜມາເລັ່ງ ບໍ່ຕ້ອງຕາມໃຈແຜນຄົນອື່ນ ແນ່ນອນວ່າຕ້ອງລະວັງຫຼາຍຂຶ້ນ ປະສົບການຂອງຂ້ອຍຄື ກ່ອນອອກເດີນທາງຕ້ອງວາງແຜນໃຫ້ດີ","In recent years more people travel alone. Some think it's lonely, but for me solo travel is a pleasure. Nobody rushes you and you needn't accommodate others' plans — stay somewhere longer if you want. Of course you must be more careful alone, especially in an unfamiliar city. My advice: plan before you leave, fix your accommodation and route in advance, so that even if problems arise you won't panic."],"q":[["作者为什么喜欢一个人旅行？",["ทำไมผู้เขียนชอบเที่ยวคนเดียว","ເປັນຫຍັງຜູ້ຂຽນມັກທ່ຽວຄົນດຽວ","Why does the writer enjoy travelling alone?"],["比较便宜","更自由","更安全","朋友太少"],1,["ข้อความบอกว่าไม่มีใครเร่งและไม่ต้อง 迁就别人的安排 ซึ่งคือความอิสระ","ຂໍ້ຄວາມບອກວ່າບໍ່ມີໃຜເລັ່ງ ບໍ່ຕ້ອງຕາມໃຈຄົນອື່ນ","No one rushes you and you needn't accommodate others — freedom."]],["作者建议出发前做什么？",["ผู้เขียนแนะนำให้ทำอะไรก่อนออกเดินทาง","ຜູ້ຂຽນແນະນຳໃຫ້ເຮັດຫຍັງກ່ອນອອກເດີນທາງ","What does the writer advise doing before departure?"],["多带钱","做好计划","找一个朋友","学习当地语言"],1,["ข้อความระบุ 出发前一定要做好计划","ຂໍ້ຄວາມລະບຸວ່າຕ້ອງວາງແຜນໃຫ້ດີ","The text says to plan properly beforehand."]],["“不至于慌张”是什么意思？",["ประโยค 不至于慌张 หมายถึงอะไร","ປະໂຫຍກນີ້ໝາຍເຖິງຫຍັງ","What does 不至于慌张 mean?"],["一定会慌张","不会慌张到那种程度","希望慌张","慌张也没关系"],1,["不至于 แปลว่าคงไม่ถึงขั้นนั้น เป็นการปฏิเสธระดับความรุนแรง","不至于 ແປວ່າຄົງບໍ່ເຖິງຂັ້ນນັ້ນ","不至于 = won't go so far as to."]]]}],"6":[{"t":"传统与创新","zh":"在全球化的今天，如何对待传统文化成了许多国家共同面临的课题。有人主张原封不动地保留，认为一旦改变就失去了本来的价值；也有人认为，传统若不能与当代生活相结合，终究会被时代淘汰。事实上，这两种观点并非水火不容。故宫博物院近年推出的文创产品便是很好的例子：它既保留了传统纹样的精髓，又让年轻人愿意主动接近。由此可见，真正的保护不是把文化关进博物馆，而是让它重新回到人们的日常生活之中。","tr":["ในยุคโลกาภิวัตน์ทุกวันนี้ การจะปฏิบัติต่อวัฒนธรรมดั้งเดิมอย่างไรกลายเป็นโจทย์ร่วมของหลายประเทศ บางคนเห็นว่าควรเก็บรักษาไว้อย่างไม่แตะต้อง เพราะเชื่อว่าเมื่อเปลี่ยนแล้วก็สูญเสียคุณค่าเดิม อีกฝ่ายเห็นว่าถ้าประเพณีไม่อาจผสานกับชีวิตร่วมสมัยได้ สุดท้ายก็จะถูกกาลเวลาคัดออก อันที่จริงสองมุมมองนี้ไม่ได้ขัดกันเสียทีเดียว สินค้าเชิงวัฒนธรรมของพิพิธภัณฑ์พระราชวังต้องห้ามในช่วงหลังเป็นตัวอย่างที่ดี คือทั้งรักษาแก่นของลวดลายดั้งเดิมไว้ และทำให้คนรุ่นใหม่อยากเข้าหาเอง จึงเห็นได้ว่าการอนุรักษ์ที่แท้จริงไม่ใช่การขังวัฒนธรรมไว้ในพิพิธภัณฑ์ แต่คือการทำให้มันกลับเข้าไปอยู่ในชีวิตประจำวันของผู้คนอีกครั้ง","ໃນຍຸກໂລກາພິວັດ ການປະຕິບັດຕໍ່ວັດທະນະທຳດັ້ງເດີມກາຍເປັນບັນຫາຮ່ວມຂອງຫຼາຍປະເທດ ບາງຄົນເຫັນວ່າຄວນຮັກສາໄວ້ຢ່າງບໍ່ແຕະຕ້ອງ ອີກຝ່າຍເຫັນວ່າຖ້າບໍ່ຜະສານກັບຊີວິດຮ່ວມສະໄໝ ສຸດທ້າຍກໍຈະຖືກຄັດອອກ ຄວາມຈິງແລ້ວສອງມຸມມອງນີ້ບໍ່ໄດ້ຂັດກັນ","In today's globalised world, how to treat traditional culture has become a shared question. Some argue for preserving it untouched, believing any change destroys its value; others hold that if tradition cannot merge with contemporary life it will eventually be discarded by time. In fact these views are not irreconcilable. The Palace Museum's cultural products are a good example: they keep the essence of traditional patterns while making young people want to engage. Real protection, then, is not locking culture in a museum but returning it to everyday life."],"q":[["第一种观点认为改变传统会怎么样？",["มุมมองแรกเห็นว่าการเปลี่ยนประเพณีจะเป็นอย่างไร","ມຸມມອງທຳອິດເຫັນວ່າແນວໃດ","What does the first view say about changing tradition?"],["会更受欢迎","会失去本来的价值","会被年轻人接受","会赚更多钱"],1,["ข้อความระบุ 一旦改变就失去了本来的价值 ใช้โครงสร้าง 一旦……就……","ຂໍ້ຄວາມລະບຸວ່າ ເມື່ອປ່ຽນແລ້ວກໍສູນເສຍຄຸນຄ່າເດີມ","一旦改变就失去了本来的价值."]],["作者举故宫的例子是为了说明什么？",["ผู้เขียนยกตัวอย่างพระราชวังต้องห้ามเพื่ออะไร","ຜູ້ຂຽນຍົກຕົວຢ່າງເພື່ອຫຍັງ","Why does the writer cite the Palace Museum?"],["博物馆很赚钱","两种观点可以结合","传统必须保留原样","年轻人不懂文化"],1,["ประโยคก่อนหน้าบอกว่า 并非水火不容 แล้วยกตัวอย่างที่ 既……又…… คือทำได้ทั้งสองอย่าง","ປະໂຫຍກກ່ອນໜ້າບອກວ່າສອງມຸມມອງບໍ່ໄດ້ຂັດກັນ","It shows the two views can be combined (既…又…)."]],["作者认为真正的文化保护是什么？",["ผู้เขียนเห็นว่าการอนุรักษ์ที่แท้จริงคืออะไร","ຜູ້ຂຽນເຫັນວ່າການອະນຸລັກທີ່ແທ້ຈິງແມ່ນຫຍັງ","What is real cultural protection?"],["放进博物馆保存","让它回到日常生活","禁止任何改变","只给专家研究"],1,["ประโยคสุดท้ายใช้ 不是……而是…… คำตอบอยู่หลัง 而是","ປະໂຫຍກສຸດທ້າຍໃຊ້ 不是……而是…… ຄຳຕອບຢູ່ຫຼັງ 而是","The answer follows 而是 in the final sentence."]]]}]};

const KEY="hsk-app-v2";
let mem=null;
const store={
 async load(){
  try{ if(window.storage){const r=await window.storage.get(KEY);return r?JSON.parse(r.value):null} }catch(e){}
  try{ const r=localStorage.getItem(KEY); if(r) return JSON.parse(r) }catch(e){}
  return mem;},
 async save(d){ mem=d;
  try{ if(window.storage){await window.storage.set(KEY,JSON.stringify(d));return} }catch(e){}
  try{ localStorage.setItem(KEY,JSON.stringify(d)) }catch(e){}},
 async clear(){ mem=null;
  try{ if(window.storage){await window.storage.delete(KEY)} }catch(e){}

};

/* ---- นำเข้า / ส่งออกข้อมูลคำศัพท์ ---- */
const HAN=/[\u4e00-\u9fff]/;

// แปลงข้อความดิบ (JSON หรือ CSV/TSV) ให้เป็นแถวคำศัพท์
function parseWords(text){
 text=String(text||"").trim();
 if(!text) return [];
 let rows=[];

 // 1) ลอง JSON ก่อน
 if(text[0]==="["||text[0]==="{"){
  try{
   let j=JSON.parse(text);
   if(!Array.isArray(j)) j=[j];
   rows=j.map(r=>{
    if(Array.isArray(r)) return r;
    if(r&&typeof r==="object"){
     const g=(...keys)=>{for(const k of keys){if(r[k]!=null&&String(r[k]).trim())return String(r[k]).trim()}return""};
     let pin=g("pinyin","p","transcription","reading");
     if(!pin&&r.forms&&r.forms[0]&&r.forms[0].transcriptions) pin=r.forms[0].transcriptions.pinyin||"";
     let en=g("en","english","meaning","definition","translation");
     if(!en&&Array.isArray(r.meanings)) en=r.meanings.slice(0,2).join(" / ");
     if(!en&&r.translations&&Array.isArray(r.translations.eng)) en=r.translations.eng.slice(0,2).join(" / ");
     return [g("c","hanzi","simplified","word","s","chinese"),pin,g("th","thai"),g("lo","lao"),en,
             g("pos","p_o_s","partOfSpeech","词性")];
    }
    return null;
   }).filter(Boolean);
  }catch(e){ rows=[] }
 }

 // 2) ถ้าไม่ใช่ JSON ให้อ่านแบบ CSV / TSV / คั่นด้วยแท็บ
 if(!rows.length){
  rows=text.split(/\r?\n/).map(line=>{
   line=line.trim(); if(!line) return null;
   const cells = line.includes("\t") ? line.split("\t")
     : line.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[];
   return cells.map(c=>c.replace(/,$/,"").trim().replace(/^"|"$/g,"").replace(/""/g,'"'));
  }).filter(Boolean);

  // ถ้าแถวแรกเป็นหัวตาราง ให้จับคู่คอลัมน์ตามชื่อ (ไฟล์แต่ละแหล่งเรียงคอลัมน์ไม่เหมือนกัน)
  if(rows.length&&!HAN.test(rows[0][0]||"")){
   const head=rows.shift().map(h=>h.toLowerCase().replace(/[^a-z\u0e00-\u0eff]/g,""));
   const SLOT=[
    [0,/^(hanzi|simplified|simp|chinese|word|character|汉字|简体)/],
    [1,/^(pinyin|reading|transcription|拼音|romanization)/],
    [2,/^(thai|ไทย|th)$|^thai/],
    [3,/^(lao|ລາວ|lo)$|^lao/],
    [4,/^(english|definition|meaning|translation|en|gloss)/],
    [5,/^(pos|partofspeech|wordtype|type|词性)/]
   ];
   const map=head.map(h=>{ for(const [slot,re] of SLOT) if(re.test(h)) return slot; return -1 });
   // ใช้การจับคู่ก็ต่อเมื่อรู้จักอย่างน้อยคอลัมน์อักษรจีน
   if(map.includes(0)){
    rows=rows.map(r=>{
     const out=["","","","","",""];
     map.forEach((slot,i)=>{ if(slot>=0&&!out[slot]) out[slot]=r[i]||"" });
     return out;
    });
   }
  }
 }

 // 3) ทำความสะอาด: ต้องมีอักษรจีนในช่องแรกเท่านั้นถึงจะรับ
 return rows
  .map(r=>[0,1,2,3,4,5].map(i=>String(r[i]==null?"":r[i]).trim()))
  .filter(r=>HAN.test(r[0]));
}

// เพิ่มคำเข้าระดับปัจจุบัน ข้ามคำที่มีอยู่แล้ว
function addWords(rows){
 const existing=new Set(words(S.level).map(w=>w.c));
 const fresh=[], seen=new Set();
 rows.forEach(r=>{
  if(existing.has(r[0])||seen.has(r[0]))return;
  seen.add(r[0]); fresh.push(r);
 });
 if(fresh.length){
  S.custom[S.level]=(S.custom[S.level]||[]).concat(fresh);
  store.save(S);
 }
 return {added:fresh.length, skipped:rows.length-fresh.length};
}

}

function levelChars(lv){
 const seen=new Set(), out=[];
 words(lv).forEach(w=>{ for(const c of w.c){ if(/[\u4e00-\u9fff]/.test(c) && !seen.has(c)){ seen.add(c); out.push(c) } } });
 return out;
