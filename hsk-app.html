<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>汉语 · HSK 1–6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Sans+Lao:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF7; --paper-2:#F2EFE8; --card:#FFFFFF;
  --ink:#1A1A18; --ink-2:#55534C; --ink-3:#918E85;
  --seal:#C1272D; --seal-soft:#FBEDED;
  --jade:#2F6B57; --jade-soft:#EAF2EE;
  --line:rgba(26,26,24,.11); --line-2:rgba(26,26,24,.2);
  --han:'Noto Serif SC',serif;
  --ui:'Noto Sans Thai','Noto Sans Lao','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.65;padding-bottom:78px}
.wrap{max-width:620px;margin:0 auto;padding:0 18px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3{font-weight:600;line-height:1.3;margin:0}
.hidden{display:none!important}
.muted{color:var(--ink-2)} .tiny{font-size:13px}
.sec-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 10px}

header{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
.hd{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--han);font-size:19px;font-weight:600;letter-spacing:.04em}
.brand span{font-size:12px;color:var(--ink-3);letter-spacing:.08em}
select{font-family:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;cursor:pointer}

.levels{display:flex;gap:7px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.lv{flex:0 0 auto;border:1px solid var(--line-2);border-radius:99px;padding:6px 15px;font-size:14px;background:var(--card);white-space:nowrap}
.lv.act{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.bar{height:5px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--jade);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:600;line-height:1.2}
.stat span{font-size:12px;color:var(--ink-3)}

.row-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:border-color .15s,transform .1s}
.row-item:hover{border-color:var(--line-2)} .row-item:active{transform:scale(.99)}
.row-item .n{font-family:var(--han);font-size:19px;width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:10px;background:var(--paper-2);color:var(--ink-2)}
.row-item .t{flex:1;min-width:0}
.row-item .t b{display:block;font-weight:500}
.row-item .t .bar{margin-top:7px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 22px;text-align:center;position:relative;overflow:hidden}
.hanzi{font-family:var(--han);font-size:60px;line-height:1.15;letter-spacing:.05em}
.pinyin{font-size:18px;color:var(--seal);letter-spacing:.03em;margin-top:6px}
.mean{font-size:19px;margin-top:12px}
.pos{display:inline-block;font-size:12px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:99px;padding:1px 10px;margin-top:12px}
.seal{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:6px;border:2.5px solid var(--seal);color:var(--seal);font-family:var(--han);font-size:15px;font-weight:600;display:grid;place-items:center;line-height:1.05;opacity:0;transform:rotate(-18deg) scale(1.7)}
.seal.on{animation:stamp .45s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes stamp{0%{opacity:0;transform:rotate(-18deg) scale(1.7)}55%{opacity:.95;transform:rotate(-9deg) scale(.94)}100%{opacity:.82;transform:rotate(-9deg) scale(1)}}

.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;background:var(--card);font-size:15px;transition:background .15s}
.btn:hover{background:var(--paper-2)}
.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.seal-b{background:var(--seal-soft);border-color:#E9B9B9;color:#8E1D22}
.btn.jade-b{background:var(--jade-soft);border-color:#B9D5C9;color:#1F4C3E}
.audio{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--line-2);border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:17px}
.counter{text-align:center;font-size:13px;color:var(--ink-3);margin-top:14px}

.g-head{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px}
.g-title{font-family:var(--han);font-size:32px;line-height:1.25}
.g-struct{display:inline-block;font-family:var(--han);font-size:15px;background:var(--paper-2);border-radius:8px;padding:7px 14px;margin-top:12px;color:var(--ink-2)}
.g-body{margin-top:14px;font-size:15px;line-height:1.75}
.g-ex{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.g-ex .z{font-family:var(--han);font-size:19px;line-height:1.6}
.g-ex .p{font-size:13px;color:var(--seal)}
.g-ex .t{font-size:14px;color:var(--ink-2);margin-top:2px}
.warn{border-left:3px solid var(--seal);background:var(--seal-soft);border-radius:0 8px 8px 0;padding:12px 15px;font-size:14px;margin-top:12px}
.warn .x{font-family:var(--han);font-size:16px;text-decoration:line-through;text-decoration-color:var(--seal);opacity:.75}
.warn .o{font-family:var(--han);font-size:16px;color:#1F4C3E}

.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:13px 16px;margin-bottom:9px}
.opt:hover:not(:disabled){background:var(--paper-2)}
.opt.right{background:var(--jade-soft);border-color:var(--jade);color:#1F4C3E}
.opt.wrong{background:var(--seal-soft);border-color:var(--seal);color:#8E1D22}
.verdict{border-radius:10px;padding:12px 15px;margin-top:4px;font-size:14px}
.verdict.ok{background:var(--jade-soft);color:#1F4C3E}
.verdict.no{background:var(--seal-soft);color:#8E1D22}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav-in button{padding:9px 2px 11px;font-size:11px;color:var(--ink-3);text-align:center;line-height:1.5}
.nav-in button b{display:block;font-family:var(--han);font-size:18px;font-weight:400}
.nav-in button.act{color:var(--seal)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--seal);vertical-align:2px;margin-left:2px}

.note{background:var(--paper-2);border-radius:10px;padding:12px 15px;font-size:13px;color:var(--ink-2);margin-top:18px}
.empty{text-align:center;padding:46px 20px;color:var(--ink-3)}
.empty b{display:block;font-family:var(--han);font-size:38px;color:var(--line-2);margin-bottom:12px}
textarea{width:100%;min-height:130px;font-family:var(--ui);font-size:13px;border:1px solid var(--line-2);border-radius:10px;padding:12px;background:var(--card);color:var(--ink)}
.drop{border:1.5px dashed var(--line-2);border-radius:12px;padding:22px 18px;text-align:center;font-size:13px;color:var(--ink-3);cursor:pointer;background:var(--card);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--jade);background:var(--jade-soft);color:#1F4C3E}
.overlay{position:fixed;inset:0;background:rgba(26,26,24,.35);z-index:60;display:grid;place-items:center;padding:22px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{background:var(--card);border-radius:16px;padding:24px 22px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(26,26,24,.22);animation:pop .18s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.dialog p{margin:0 0 18px;font-size:15px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
 padding:11px 20px;border-radius:99px;font-size:14px;z-index:70;box-shadow:0 6px 20px rgba(26,26,24,.28);animation:pop .2s}

/* --- หน้ารายการคำศัพท์ --- */
.listhead{position:sticky;top:58px;background:var(--paper);z-index:10;padding-bottom:10px;margin:0 -18px;padding-left:18px;padding-right:18px;border-bottom:1px solid var(--line)}
.filters{display:flex;gap:7px;margin-top:9px}
.fchip{flex:1;border:1px solid var(--line-2);border-radius:99px;padding:6px 4px;font-size:13px;background:var(--card);text-align:center}
.fchip.act{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.alpha{font-family:var(--han);font-size:11px;letter-spacing:.14em;color:var(--ink-3);margin:20px 0 8px;text-transform:uppercase}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.wcard.open{border-color:var(--line-2);box-shadow:0 2px 10px rgba(26,26,24,.05)}
.wmain{display:flex;align-items:center;gap:14px;padding:12px 15px;cursor:pointer}
.wz{font-family:var(--han);font-size:25px;line-height:1.25;flex:0 0 auto;min-width:58px}
.wp{font-size:13px;color:var(--seal);letter-spacing:.02em}
.wm{font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtag{flex:0 0 auto;font-family:var(--han);font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.wok{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--jade-soft);color:var(--jade);
 display:grid;place-items:center;font-size:12px}
.wdetail{border-top:1px dashed var(--line-2);padding:14px 15px;background:var(--paper)}
.wdetail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}
.wdetail dt{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.wdetail dd{margin:0}
.psg{font-family:var(--han);font-size:19px;line-height:2.05;text-align:left}
.psg span{cursor:pointer;border-radius:4px;transition:background .15s}
.psg span:hover{background:var(--paper-2)}
.psg span.on{background:var(--seal-soft)}
.tr-box{border-top:1px dashed var(--line-2);margin-top:16px;padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink-2)}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.qz{font-family:var(--han);font-size:16px;line-height:1.6}
.exhead{position:sticky;top:58px;background:var(--paper);z-index:10;padding:12px 18px 12px;margin:0 -18px 14px;border-bottom:1px solid var(--line)}
.extab{width:100%;font-size:14px;border-collapse:collapse}
.extab td{padding:5px 0}
.extab td:first-child{color:var(--ink-3);font-size:13px}
.extab td:last-child{text-align:right}
.answerline{min-height:46px;border-bottom:2px solid var(--line-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:8px}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.wchip{font-family:var(--han);font-size:19px;border:1px solid var(--line-2);border-radius:9px;padding:7px 13px;background:var(--card)}
.wchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.wchip.used{opacity:.28}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;margin-top:10px}
.ctile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 3px 7px;text-align:center;cursor:pointer;transition:border-color .12s,transform .08s}
.ctile:hover{border-color:var(--line-2)} .ctile:active{transform:scale(.96)}
.ctile b{display:block;font-family:var(--han);font-size:26px;font-weight:400;line-height:1.15}
.ctile span{display:block;font-size:10px;color:var(--seal);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hwgrid{border:1px solid var(--line-2);border-radius:10px;background:
  linear-gradient(var(--line) 0 0) center/100% 1px no-repeat,
  linear-gradient(var(--line) 0 0) center/1px 100% no-repeat;
  width:100%;max-width:270px;margin:0 auto;aspect-ratio:1/1;display:grid;place-items:center}
.search{width:100%;font-family:var(--ui);font-size:15px;border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;background:var(--card);color:var(--ink);margin-top:4px}
.wrow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:7px;cursor:pointer}
.wrow:hover{border-color:var(--line-2)}
.wz{font-family:var(--han);font-size:23px;flex:0 0 auto;min-width:52px}
.wp{font-size:13px;color:var(--seal)}
.wm{font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{flex:0 0 auto;font-family:var(--han);font-size:19px;border:1px solid var(--line-2);border-radius:8px;padding:4px 9px;background:var(--card)}
.chip.act{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.needtrans{display:inline-block;font-size:11px;color:#8E1D22;background:var(--seal-soft);border-radius:99px;padding:2px 10px;margin-top:10px}
summary::-webkit-details-marker{display:none}
summary{list-style:none;text-decoration:underline}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--paper-2);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <div class="brand"><b>汉语</b><span id="lvTag">HSK 1</span></div>
    <select id="lang" aria-label="Language">
      <option value="th">🇹🇭 ไทย</option><option value="lo">🇱🇦 ລາວ</option>
      <option value="zh">🇨🇳 中文</option><option value="en">🇬🇧 English</option>
    </select>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav><div class="nav-in" id="nav">
  <button data-v="home" class="act"><b>家</b><span data-t="navHome">หน้าแรก</span></button>
  <button data-v="learn"><b>词</b><span data-t="navLearn">คำศัพท์</span></button>
  <button data-v="grammar"><b>法</b><span data-t="navGram">ไวยากรณ์</span></button>
  <button data-v="exam"><b>考</b><span data-t="navExam">สอบจำลอง</span></button>
</div></nav>

<script>
const UI={
th:{navHome:"หน้าแรก",navLearn:"คำศัพท์",navGram:"ไวยากรณ์",navExam:"สอบจำลอง",
